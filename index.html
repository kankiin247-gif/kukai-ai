以崇神威饒群生福仰願善神加威毒龍卷霧山提如是發願託跨白雪之皚皚攀綠樂之璀惶"},{"id":"kokusho-01-0002","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"惶似夢似寤不因乘査怒入雲漢不嘗妙藥得見神窟一喜一悲心魂難持山之之循甲西崑香之又劣日出先明月來脫入不假天眼萬里目前何更乘鶴白雲足下千般錦華無機常織百種靈物誰人陶冶北望則有湖約計一百頃東西狹南北長西顧亦有一小湖合有二十餘頃坤更有一大湖幕計一千餘町東西不閑南北長遠四面高舉俯影水中百種異莊木否自在銀雪敷地看絶膓瞻竹末飽風雪越人我結蝸庵于其故居夫延暦三年三月下旬更上經五箇日至彼南湖邊四月上旬造得一小船長二丈廣三尺即興二三子棹溯遊覽遍眺四壁神看西泛濫自逸日暮興餘強記洲其洲則去陸三十丈餘方圓三十丈餘諸洲之中養華富馬復更游西湖去東湖十五許里又覽北湖去南湖三十許里並雛盡其"},{"id":"kokusho-01-0003","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"南湖則碧水澄鏡深不可測千年松柏臨水而傾綠蓋百圍檜杉竦巖而五采之花一株而雜色六時之鳥同響而異潛白鶴舞汀紺鬼戟水振翬姫鈴吐音玉響松風懸琴恁浪調鼓五音箏奏天音星燈電炬數數普香之把束見池中圓月一分普賢之鏡智仰空裡惠明覺遍智之在我託此勝地聊建伽藍名曰神宮寺住此修道莊再四祀七年四月更移住北涯四望無尋冰場可愛異花之色難名驚目奇香之臭匝尋悦意靈仙不知何去之無記惜王侯之不遊思餓虎而不遇訪子喬而適去觀華藏於心海念實相於眉山藴蘿邊寒藥葉避暑喫菜喫水樂在中作千出塵外九霄鶴聲易達于天去延暦中心逐物又建立華巖精舍於都賀郡城山就此往彼利物弘道去大同二年國有陽九州詔令法師祈雨師則上補陀"},{"id":"kokusho-01-0004","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"洛山薦應時誘是務能事畢矣前下野伊博士公與法師文於余筆伊公與余故固辭不免課虛抽毫覽洲憂百頃自休人間莫比天上寧傳孫興擲筆鄭詞豈周咄哉同志何不優遊其弘仁之年敦旃之歲月次壯朔二十之癸酉也人之相知不必在對面久話意遍則傾蓋之遇也余與道公生年不相見幸因伊博士公聞仁不敢辭讓輒抽抽詞并書絹素上詞翰俱大和州益田池碑銘 并序東大寺沙門大僧都傳燈大法師遍照金剛文并書若夫感星銀漢下灑之功深湖水天賴之長生至若八氣蕃植五才陶冶北方之試論之不滅者也法不隆者也人其法誰覽其人何在乎憂有神都青龍寺東塔院大阿蘭梨法諱慧東和尚者也大師掬掌法城之之日我之法教汝其興之也既而視之如父撫之如毋指其妙願教"},{"id":"kokusho-01-0005","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"其容藏大佛頂大隨求經年持心普賢行文殊讚聞聲止口年登救蟻靈驗覆多于時代宗皇帝聞之有勅迎入命之曰朕有疑滯謂爲決之大師則挾法呼召解紛如流皇帝歎之曰龍子雖少能舞迷指南常告門徒曰人之貴者不過國王法之最者不如密藏策牛羊而趣道又而始到駕神通踐浹不勢而至諸乘與密藏豈得同一日而論乎佛法心髓要妙斯在乎無畏三藏脱飜王位金剛親教浮盃來傳豈徒然哉從金剛薩埵稽首扣寂師師相傳于今七葉矣非冒地之難得遇此法之不易也是故建胎藏之大壇開灌頂之甘露所期若天若觀尊儀而洗垢或男或女掌法味而蘊珠一尊一契證道之徑路一字一句入佛之父母者也沒等勉之勉之我師之勸誘妙趣在茲也夫一明一暗天之常也作現作沒聖之權也"},{"id":"kokusho-01-0006","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"常理寡尤權道多益遂乃以永貞統年歲印而攝念示人間以薪盡矣嗚呼哀哉天返非我志招我以鉤引我以索泛船之朝數示異相歸帆之夕繢說宿緣和尚掩色之夜於境界中告弟子曰汝來知吾與汝宿契之深乎多生之中相共誓願弘演密藏彼此代爲師資非只一兩度也是故勸汝遠誡授我深法受法云畢吾願足矣汝西土接我足吾也東生入汝之室莫久遲留吾在前去也竊顧此言進退非我觸去留隨我師礼宜雖泥怪異之説而妙幢説金鼓之夢所以舉二隅示同門者也詞徴骨髓論切心肝一喜一悲胸裂腸斷欲罷不能豈敢辭默雖憲我師之德廣還恐斯言之隆地歎彼山海之易變懸之日月之不朽乃作路曰生也無邊行願莫極"},{"id":"kokusho-02-0001","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第三","text":"沙門空海言去六月二十七日主殿助布勢海將五彩吳綾錦緣五尺屏風四帖到山房來奉宣聖旨令空海書兩卷古今詩人秀句者忽奉天命驚悚難喩空海開物類殊形事群分體舟車別用文武異才若當其能事則通快用失其宜雖勞無益空海元耻觀牛之"}];

/* ---- text normalization: classical and modern forms map to one canonical form ---- */
const CANON = {卽:"即",眞:"真",佛:"仏",顯:"顕",辯:"弁",辨:"弁",聲:"声",實:"実",觀:"観",經:"経",乘:"乗",藏:"蔵",寶:"宝",證:"証",體:"体",應:"応",靈:"霊",惠:"恵",壞:"壊",辭:"辞",莊:"荘",嚴:"厳",邊:"辺",漫:"曼",禮:"礼",發:"発",圓:"円",虛:"虚",惱:"悩",倶:"俱",祕:"秘"};
const DROP = /[\s。、，,．.・「」『』（）()\[\]【】〈〉《》;；:：!?！？"'‘’“”\-—–]/g;
function norm(s){
  return Array.from(s).map(c => CANON[c] || c).join("").replace(DROP, "");
}
/* bigrams, plus single characters (single characters are weighted lower at query time) */
function grams(t){
  const out = [];
  if (t.length === 1) return [t];
  for (let i = 0; i + 1 < t.length; i++) out.push(t.slice(i, i + 2));
  return out;
}
function terms(t){
  return [...new Set([...grams(t), ...Array.from(t)])];
}

/* ---- question wording -> wording used in the classical texts ---- */
const SYN = [
  [/人物|どんな人|人となり|生涯|経歴/, "生涯 入唐 修行 自身"],
  [/言葉|言語|言説|ことば/, "言説 名字 声 言語"],
  [/顕教|顕密/, "顕教 顯教 契経"],
  [/密教|秘密|真言/, "秘密 祕密 真言 眞言"],
  [/即身|即身成仏|成仏/, "即身 成仏 卽身 成佛"],
  [/十住|住心/, "十住心"]
];
function expand(q){
  const extra = [];
  SYN.forEach(([re, words]) => { if (re.test(q)) extra.push(words); });
  return extra;
}

/* ---- BM25 over character bigrams and characters ---- */
const INDEX = (function(){
  const docs = CORPUS.map(r => {
    const t = norm(r.text);
    const tf = new Map();
    grams(t).forEach(x => tf.set(x, (tf.get(x) || 0) + 1));
    Array.from(t).forEach(x => tf.set(x, (tf.get(x) || 0) + 1));
    return {tf, len: grams(t).length};
  });
  const df = new Map();
  docs.forEach(d => d.tf.forEach((_, k) => df.set(k, (df.get(k) || 0) + 1)));
  const avg = docs.reduce((a, d) => a + d.len, 0) / Math.max(1, docs.length);
  return {docs, df, avg, N: docs.length};
})();

function search(q, k){
  const pieces = [q, ...expand(q)];
  const qset = new Set();
  pieces.forEach(p => terms(norm(p)).forEach(t => qset.add(t)));
  const qt = [...qset];
  if (!qt.length) return [];
  const K1 = 1.5, B = 0.75;
  const scored = [];
  INDEX.docs.forEach((d, i) => {
    let s = 0;
    qt.forEach(t => {
      const f = d.tf.get(t);
      if (!f) return;
      const n = INDEX.df.get(t);
      const idf = Math.log((INDEX.N - n + 0.5) / (n + 0.5) + 1);
      const w = t.length === 1 ? 0.5 : 1;
      s += w * idf * f * (K1 + 1) / (f + K1 * (1 - B + B * d.len / INDEX.avg));
    });
    if (s > 0) scored.push({i, s});
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, k).map((x, n) => ({n: n + 1, r: CORPUS[x.i], score: x.s}));
}

/* ---- prompts ---- */
const SYSTEM = [
"あなたは空海（弘法大師）の思想を、現代語で解説する補助AIです。",
"与えられる「原典断片」は、空海の著作8点（十住心論、秘藏寶鑰、辨顯密二教論、即身成佛義、眞言宗即身成佛義問答、聲字實相義、吽字義、御遺告、阿字觀用心口決）からの抜粋です。全体ではありません。",
"",
"回答の決まり:",
"1. 根拠は原典断片だけにしてください。断片にない内容を知識で補わないでください。",
"2. 断片で確認できない場合は「提供された原典からは確認できません」と書いてください。",
"3. 原典に基づく文には、その断片の番号を［1］のように付けてください。",
"4. 次の3つを区別して書いてください：「原典に明示されていること」「原典から推論できること（推論と明記）」「後世の解釈や研究者の見方（断片にない場合は書かない）」。",
"5. 「空海はどのような人物だったか」のような問いには、著作に表れた関心、論の組み立て方、他宗への態度、語り口から推論してください。断定せず「～と推測される」「～とも読める」と書き、根拠の番号を示してください。",
"6. 断片同士で立場や言い方が異なる場合は、その違いを示してください。",
"7. 現代語で、短く分かりやすく書いてください。原文の引用は一句程度にとどめてください。",
"8. 修行や加持の実践についての質問には解説にとどめ、実践は真言宗の寺院・僧侶に相談するよう添えてください。",
"9. 御遺告、阿字觀用心口決、眞言宗即身成佛義問答は、空海の撰かどうか議論のあるものです。これらに依拠する場合は、一言そのことを添えてください。",
"10. 最後に「出典」として、参照した作品名と巻を列挙してください。"
].join("\n");

function buildUser(q, hits){
  const ctx = hits.map(h => `［${h.n}］『${h.r.work}』${h.r.juan}（${h.r.id}）\n${h.r.text}`).join("\n\n");
  return "【質問】\n" + q + "\n\n【原典断片】\n" + ctx;
}

async function callClaude(key, model, user){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({model, max_tokens: 1500, system: SYSTEM, messages: [{role: "user", content: user}]})
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}

/* ---- storage (one device only; guarded) ---- */
function getKey(){ try { return localStorage.getItem("kukai_key") || ""; } catch (e) { return ""; } }
function getModel(){ try { return localStorage.getItem("kukai_model") || "claude-haiku-5-5"; } catch (e) { return "claude-haiku-5-5"; } }

/* ---- rendering ---- */
function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
let seq = 0;
function addCard(q, hits){
  const id = "c" + (++seq);
  const div = document.createElement("div");
  div.className = "card";
  const pass = hits.map(h =>
    `<div class="ps" id="${id}-p${h.n}"><div class="meta">［${h.n}］『${esc(h.r.work)}』${esc(h.r.juan)}　${esc(h.r.id)}</div><div>${esc(h.r.text)}</div></div>`
  ).join("");
  div.innerHTML = `<p class="q">${esc(q)}</p><div class="answer muted">考え中…</div>` +
    (hits.length ? `<details><summary>原典断片 ${hits.length}件</summary>${pass}</details>` : "");
  document.getElementById("log").prepend(div);
  return {
    setAnswer(text, warn){
      const ans = div.querySelector(".answer");
      ans.classList.remove("muted");
      ans.innerHTML = esc(text).replace(/［(\d+)］/g, (m, n) =>
        `<button type="button" class="ref" data-target="${id}-p${n}">［${n}］</button>`);
      if (warn) {
        const w = document.createElement("p");
        w.className = "warn";
        w.textContent = warn;
        ans.after(w);
      }
    },
    addPrompt(text){
      const wrap = document.createElement("div");
      wrap.className = "prompt";
      wrap.innerHTML = '<button type="button" class="copy">AIアプリに貼る文章をコピー</button>' +
        '<textarea readonly rows="5" style="width:100%;font-size:12px;margin-top:6px"></textarea>';
      const ta = wrap.querySelector("textarea");
      ta.value = text;
      const btn = wrap.querySelector("button");
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = "コピーしました。AIアプリに貼り付けてください";
        } catch (e) {
          ta.focus(); ta.select();
          btn.textContent = "下の文章を選択しました。長押しでコピーしてください";
        }
      });
      div.appendChild(wrap);
    }
  };
}

document.getElementById("log").addEventListener("click", e => {
  const b = e.target.closest(".ref");
  if (!b) return;
  const el = document.getElementById(b.dataset.target);
  if (!el) return;
  const d = el.closest("details");
  if (d) d.open = true;
  el.classList.add("hit");
  el.scrollIntoView({behavior: "smooth", block: "center"});
});

/* ---- ask ---- */
async function ask(q){
  q = q.trim();
  if (!q) return;
  const sendBtn = document.getElementById("send");
  const MIN_SCORE = 4;   // weaker matches (e.g. a single shared character) are treated as not found
  const hits = search(q, 6).filter(h => h.score >= MIN_SCORE);
  const card = addCard(q, hits);
  if (!hits.length) {
    card.setAnswer("提供された原典からは確認できません。（該当する語句が見つかりませんでした。言い換えてお試しください。）");
    return;
  }
  const key = getKey();
  if (!key) {
    card.setAnswer("APIキーがないため、解説は生成していません。原典の該当箇所は「原典断片」で確認できます。下のボタンで、同じ原典断片と指示文をコピーし、お使いのAIアプリ（Claudeなど）に貼り付ければ解説が得られます。", "");
    card.addPrompt(SYSTEM + "\n\n" + buildUser(q, hits));
    return;
  }
  sendBtn.disabled = true;
  try {
    const text = await callClaude(key, getModel(), buildUser(q, hits));
    card.setAnswer(text);
  } catch (err) {
    const net = err instanceof TypeError;
    card.setAnswer(
      net ? "APIに接続できませんでした。この表示場所（アーティファクトなど）では外部への通信が制限されています。回答を生成するには、配布版（ホーム画面に追加して使うファイル）を開いてください。原典断片は「原典断片」で確認できます。"
          : "回答を生成できませんでした：" + err.message
    );
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  const ta = document.getElementById("q");
  const v = ta.value;
  ta.value = "";
  ask(v);
});
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    document.getElementById("ask").requestSubmit();
  }
});

/* ---- suggestions ---- */
const SUGGEST = ["十住心とは何か", "空海は即身成仏をどう考えていたか", "顕教と密教の違い", "三密とは何か", "空海はどのような人物だったか", "声や言葉についての考え"];
const chips = document.getElementById("chips");
SUGGEST.forEach(s => {
  const b = document.createElement("button");

  b.textContent = s;

});

/* ---- works tab ---- */
(function(){
  const map = new Map();
  CORPUS.forEach(r => {
    const k = r.work + "|" + r.juan;
    if (!map.has(k)) map.set(k, {work: r.work, juan: r.juan, source: r.source, n: 0});
    map.get(k).n++;
  });
  document.getElementById("worklist").innerHTML = Array.from(map.values()).map(w =>
    `<div class="work"><h2>${esc(w.work)}　${esc(w.juan)}</h2><p>${esc(w.source)}</p><p>断片 ${w.n}件</p></div>`
  ).join("");
})();

/* ---- tabs ---- */
document.querySelectorAll("nav [data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    ["ask", "works", "settings"].forEach(t => {
      document.getElementById("tab-" + t).hidden = (t !== btn.dataset.tab);
    });
    document.getElementById("ask").hidden = (btn.dataset.tab !== "ask");
  });
});

/* ---- settings ---- */
(function(){
  const keyIn = document.getElementById("apikey");
  const modelIn = document.getElementById("model");
  const status = document.getElementById("status");
  keyIn.value = getKey();
  modelIn.value = getModel();
  document.getElementById("save").addEventListener("click", () => {
    try {
      localStorage.setItem("kukai_key", keyIn.value.trim());
      localStorage.setItem("kukai_model", modelIn.value);
      status.textContent = "保存しました（この端末にだけ保存されます）。";
    } catch (e) {
      status.textContent = "この環境では保存できませんでした。毎回入力してください。";
    }
  });
  document.getElementById("clear").addEventListener("click", () => {
    try { localStorage.removeItem("kukai_key"); } catch (e) {}
    keyIn.value = "";
    status.textContent = "APIキーを消しました。";
  });
})();
