<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="空海AI">
<meta name="theme-color" content="#f7f5f0">
<title>空海AI｜思想を原典から読む</title>
<style>
:root{--bg:#f7f5f0;--fg:#22201c;--muted:#6f6a5e;--card:#fffdf8;--line:#e2dccd;--accent:#7a3e1d;--chip:#efe8d8;--warn:#8a5a00}
@media (prefers-color-scheme: dark){:root{--bg:#171613;--fg:#ece7da;--muted:#a39c8b;--card:#222018;--line:#3a3628;--accent:#e0a270;--chip:#2c2920;--warn:#e7c27d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
h1{font-size:1.15rem;margin:0 0 6px;font-weight:700}
h1 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px;font-size:.95rem;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{flex:1;padding:14px 14px 150px;max-width:720px;width:100%;margin:0 auto}
.intro{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:14px}
.q{font-weight:700;margin:0 0 8px;font-size:1rem}
.answer{white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.answer .ref{border:0;background:var(--chip);color:var(--accent);border-radius:6px;padding:0 4px;font-size:.8rem;cursor:pointer;font-family:inherit}
.muted{color:var(--muted);font-size:.85rem}
.warn{color:var(--warn);font-size:.85rem;margin:6px 0 0}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.ps{border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:10px 0;font-size:.9rem;scroll-margin-top:120px}
.ps .meta{color:var(--muted);font-size:.78rem}
.ps.hit{background:var(--chip)}
footer.note{font-size:.78rem;color:var(--muted);margin-top:18px}
form#ask{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;max-width:720px;margin:0 auto}
form#ask textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--fg)}
form#ask button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;font-size:.95rem;font-weight:700;cursor:pointer}
form#ask button:disabled{opacity:.5}
section[hidden]{display:none}
.work{border-bottom:1px solid var(--line);padding:12px 0}
.work h2{font-size:1rem;margin:0 0 4px}
.work p{margin:2px 0;font-size:.85rem;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.88rem;margin-bottom:4px;color:var(--muted)}
.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#status{font-size:.85rem;color:var(--muted);min-height:1.4em}
</style>
</head>
<body>
<header>
  <h1>空海AI<small>提供された原典だけを根拠に</small></h1>
  <nav role="tablist">
    <button type="button" role="tab" data-tab="ask" aria-selected="true">質問</button>
    <button type="button" role="tab" data-tab="works" aria-selected="false">原典</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">設定</button>
  </nav>
</header>

<main>
  <section id="tab-ask">
    <p class="intro">空海の著作8点（十住心論、秘藏寶鑰、辨顯密二教論、即身成佛義ほか）から、空海の思想を現代語で解説します。推論を含む箇所は、そのように明記します。</p>
    <div class="chips" id="chips"></div>
    <div id="log"></div>
  </section>

  <section id="tab-works" hidden>
    <p class="intro">この画面が根拠にしている原典の一覧です。</p>
    <div id="worklist"></div>
  </section>

  <section id="tab-settings" hidden>
    <div class="field">
      <label for="apikey">Anthropic APIキー（この端末にだけ保存されます）</label>
      <input id="apikey" type="password" autocomplete="off" placeholder="sk-ant-...">
    </div>
    <div class="field">
      <label for="model">回答モデル</label>
      <select id="model">
        <option value="claude-haiku-5-5">速い（Haiku 5.5）</option>
        <option value="claude-sonnet-5-5">じっくり（Sonnet 5.5）</option>
      </select>
    </div>
    <div class="btns">
      <button type="button" class="primary" id="save">保存</button>
      <button type="button" id="clear">キーを消す</button>
    </div>
    <p id="status"></p>
    <footer class="note">
      APIキーがないときは、原典の該当箇所だけを表示します。回答の生成にはAPI利用料がかかります。このページを開いている端末以外には送られません（回答生成のときだけAnthropicのAPIに送信されます）。
    </footer>
  </section>
</main>

<form id="ask" autocomplete="off">
  <textarea id="q" rows="2" placeholder="例：空海は即身成仏をどう考えていたか"></textarea>
  <button id="send" type="submit">送る</button>
</form>

<script>
"use strict";
/* ---- corpus (injected at build time) ---- */
const CORPUS = [{"id":"jujushin-00-0001","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"秘密漫荼羅十住心論卷第一歸命婀尾羅呴欠最極大祕法界體舸遮吒多婆壄慧咿汚哩嚧翳等持制體幢光水生貝五鈷刀蓮軍持等日旗華觀天鼓渤薩寶法業内外供捏鑄刻業及威儀能所無礙六丈夫如是自他四法身法然輪圓我三密天珠渉入遍虚空重重無礙過刹塵奉天恩詔述祕義驚覺群眠迷自心平等顯證本四曼入我我入莊嚴徳夫。歸宅必資乘道。愈病會處藥方。病源巨多方藥非一。已宅遠近道乘千差。四百之病由四蛇而苦體。八萬之患因三毒而害心。身病雖多其要唯六。四大鬼業是也。心病雖衆其本唯一。所謂無明是也。身病對治有八。而心病能治有五也。湯散丸酒針灸呪禁者身之能治也。四大之乖服藥而除。鬼業之祟呪悔能銷。"},{"id":"jujushin-00-0002","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"藥力不能却業鬼。呪功通治一切病。世醫所療唯身病也。其方則大素本草等文是也。治心病術大聖能説。其經則五藏之法是也。所謂五藏者。修多羅毘奈耶阿毘達磨般若總持等藏也。如是五藏譬如牛五味。乳酪生熟兩酥醍醐如次配之。四藏之藥但治輕病。不能消重罪。所謂重罪者。四重八重五逆謗方等一闡提是也。如醍醐通治一切病。總持妙藥能消一切重罪。速拔無明株杌。衆生住宅略有十處。一地獄。二餓鬼。三傍生。四人宮。五天宮。六聲聞宮。七縁覺宮。八菩薩宮。九一道無爲宮。十祕密漫荼羅金剛界宮。衆生狂迷不知本宅。沈淪三趣跉跰四生。不知苦源無心還本。聖父愍其如是示其歸路。歸路有徑紆。所乘有遲疾。"},{"id":"jujushin-00-0003","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"牛羊等車逐紆曲而徐進。必經三大無數劫。神通寶輅淩虚空而速飛。一生之間必到所詣。人天二宮雖不免燒燬。比之三趣樂而不苦。故慈父且與人天乘濟彼極苦。二乘住處雖是小城。比彼生死已出火宅。故大覺假説羊鹿車暫息化城。菩薩權佛二宮。亦雖云未到究極金剛界。比前諸住處亦是大自在安樂無爲。故如來與大小二牛示其歸舍。如上二宮。但芟薙宅中之荒穢。猶未開地中之寶藏。空甞大海之醎味。孰獲龍宮之摩尼。從淺至深從近迄遠。雖云轉妙轉樂。由是蜃樓幻化之行宮。未入三祕密五相成身四種曼荼究竟眞實金剛心殿。從彼人天迄顯一乘。並是應化佛對治心病之藥。他受尊運載狂子之乘。名宗則七宗並鑣而馳和漢。"},{"id":"jujushin-00-0004","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"言車則三四雙轍而遊東西。各美己戟忘己楯。並發他疵蔽他善。是非紛紜勝負不定。吠聲之徒朋黨相扇。雷缶之響周比痏瘡。是則非設方之本懷。還乖醫王之雅意。譬如惡寫而求補愛藥而惡毒。誰知體病悉藥乖方並毒。嗚呼痛哉嗚呼痛哉。縱使耆婆更生神農再出。豈棄此取彼惡毒愛藥哉。鉤挽野葛應病妙藥。何況朮黄金丹誰無除病延算之績。苦哉末學。逃大虚於小室。偸鳴鐘乎掩耳。惡水愛火捨心愛色。若能明察密號名字。深開莊嚴祕藏。則地獄天堂佛性闡提煩惱菩提生死涅槃邊邪中正空有偏圓二乘一乘。皆是自心佛之名字。焉捨焉取。雖然知祕號者猶如麟角。迷自心者既似牛毛。是故大慈説此無量乘。令入一切智。"},{"id":"jujushin-00-0005","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若竪論則乘乘差別淺深。横觀則智智平等一味。惡平等者。未得爲得不同爲同。善差別者。分滿不二即離不謬。迷之者以藥夭命。達之者因藥得仙。迷悟在己無執而到。有疾菩薩迷方狂子。不可不愼。至如祕密曼荼羅金剛心殿。是則最極究竟心王如來大毘盧遮那自性法身住處。若有衆生生輪王種性。有大度勇鋭不樂前諸住宮。則許大日所乘一體速疾神通寶輅。具授潅頂職位令受用刹塵無盡莊嚴寶藏。淺深優劣具列如後。大毘盧遮那經。祕密主問佛言。世尊。云何如來應供正遍知得一切智智。彼得一切智智。爲無量衆生廣演分布乃至如是智慧。以何爲因。云何爲根。云何究竟。大日尊答。菩提心爲因。大悲爲根。方便爲究竟。"},{"id":"jujushin-00-0006","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"祕密主。云何菩提謂如實知自心。又問。發趣菩提之時。心所住處相續次第幾種。佛具答之。故經初品名曰住心。今依此經顯眞言行者住心次第。顯密二教差別亦在此中。住心雖無量。且擧十綱攝之衆毛一異生羝羊住心二愚童持齋住心三嬰童無畏住心四唯蘊無我住心五拔業因種住心六他縁大乘住心七覺心不生住心八一道無爲住心九極無自性住心十祕密莊嚴住心異生羝羊住心第一異生羝羊心者。此則凡夫不知善惡之迷心。愚者不信因果之妄執。我我所執常懷胸臆。虚妄分別鎭蘊心意。逐陽焔而渇愛。拂華燭而燒身。既同羝羊之思草婬。還似孩童之愛水月。不曾觀我自性。何能知法實諦。違教違理從此而生。從冥入冥相續不斷。"},{"id":"jujushin-00-0007","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"比循迴於車輪均無端於環玉。昏夜長遠金雞何響。雲霧靉靆日月誰搴。來途無始歸舍幾日。不覺火宅之八苦。寧信罪報之三途。遂乃嗜滋味乎水陸。耽華色乎乾坤。放鷹催犬斷填腹之禽命。走馬彎弓殺快舌之獸身。涸澤竭鱗族傾薮斃羽毛。合圍以爲樂多獲以爲功。不顧解網之仁豈行泣辜之悲。荒婬無度晝夜樂只。或抄掠他財物奸犯人妻妾。四種口過三種心非。誹謗人法播植闡提。無時不作無日不行。不忠不孝無義無慈。五常不能羅網。三乘不得牢篭。祖習邪師依憑邪教。不曾求出要一向營眼前。如是衆生名曰愚童羝羊。故大日世尊告祕密主言。祕密主。無始生死愚童凡夫。執著我名我有分別無量我分。"},{"id":"jujushin-00-0008","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若彼不觀我之自性我我所生。又云。祕密主。愚童凡夫類猶如羝羊注。善無畏三藏釋云。從此已下十種住心。佛答心相續之義也。欲明淨心最初生起之由故。先説愚童凡夫違理之心。無始生死者。智度論云。世間若衆生若法皆無有始。經中佛言。無明覆愛所繋。往來生死始不可得。乃至菩薩。觀無始亦空而不墮有始見中。愚童者。具云愚童薩埵。謂六道凡夫。不知實諦因果。心行邪道修習苦因。戀著三界堅執不捨。故以爲名。凡夫者。正譯應云異生。謂由無明故隨業受報不得自在。墮於種種趣中。色心像類各各差別。故曰異生也。其所計我。但有語言而無實事。故云執著我名。言我有者即是我所。如是我我所執。"},{"id":"jujushin-00-0009","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"如十六知見等隨事差別無量不同。故名爲分。次釋虚妄分別所由。故云若彼不觀我之自性則我我所生。若彼觀察諸蘊皆悉從衆縁生。是中何者是我。我住何所。爲即蘊異蘊相在耶。若能如是諦求當得正眼。然彼不自觀察。但展轉相承。自久遠已來祖習此見。謂我在身中能有所作。及長養成就諸根。唯此是究竟道餘皆妄語。以是故名爲愚童也。羝羊是畜生中性最下劣。但念水草及婬欲事餘無所知。故天竺語法以喩不知善惡因果愚童凡夫類。此是羝羊。凡夫所動身口意業皆是惡業。身惡業有三。謂殺盜婬。口惡業有四。謂妄語麁惡離間無義是也。意惡業有三。謂貪瞋癡是也。如是十種惡業。一一皆招三惡道果。且就初殺生業説之。"},{"id":"jujushin-00-0010","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"由貪衆生皮宍角等故斷有情命。令彼受苦痛故感地獄苦。由味著其血宍故感餓鬼果。一切衆生皆是我四恩。由無明愚癡故。愛彼血肉斷其命根。坐此愚癡罪故感畜生果。若生人中時亦感二種果。斷他命根故短命。生他苦痛故多病。如殺生業招三惡趣果者。餘業果報亦復如是。具如華嚴經説。十惡爲本有無量惡業。乘此惡業感無量惡報。惡果雖無量不出三趣。所謂地獄餓鬼傍生也。人及阿修羅二趣。非是純惡雜業所感。如是五趣皆依器界而住。此器界有五輪山海等差別。依正二報具説如後初明五輪山海。次顯四大洲等。後擧五趣。"},{"id":"jujushin-00-0011","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"所依器界總頌器界從何起風輪初遍空水金相續出地火在其中八海深八萬九山竦穹隆四洲與八嶋人鬼畜地宮五輪頌大虚無邊際風量等三千水輪厚八億金地廣同前火大在何處遍滿四輪邊五輪因何出衆生業使然注曰。依起世經倶舍瑜伽等論。空輪者最下虚空。不可言其邊際限量。而風輪等依止而住。風輪者。依止虚空有風輪生量廣無數。厚十六億踰繕那。梵云踰繕那。此十六里。云由旬由延。皆訛略也。其體堅密依虚空。水輪者。大雲澍雨滴如車軸。厚八億踰繕那。徑十二億三千四百五十踰繕那。周圍三倍。依風輪住。金輪者。有情業力感別風起。搏撃此水上結成金。厚三億二萬踰繕那。廣等水輪。周圍三倍。"},{"id":"jujushin-00-0012","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"依水輪住九山八海頌曰妙高十六萬雙軸繞其邊實樹將善見金色入青天馬耳與象鼻魚山在鐵前六海廣八萬第七一千餘醎水剩三億内七出扶蕖注。九山八海者。於金輪上有九大山。山間八海。妙高山王處中而住。餘八周匝繞妙高山。於八山中前七名内。第七山外有大洲等。此外復有鐵輪圍山圍一世界。妙高山王入水出水並各八萬踰繕那量。四寶合成。如次四面北東南西。金銀吠瑠璃頗胝迦寶。隨寶威徳色顯於空。故瞻部洲空似吠瑠璃色。如是山海從何而生。是諸有情業増上力。復大雲起雨金輪上滴如車軸。積水奔濤即爲山等起世經云。此山及七金山上。皆有寶樹莊嚴第一山者。梵云犍馱羅山。此云持雙山。頂有雙跡故。"},{"id":"jujushin-00-0013","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"等名七金山者皆純金所成。入水量等並皆八萬踰繕那。多諸寶樹。此山出水及山頂厚量皆四萬踰繕那自下山體及入水量准知持雙山内海深廣。並皆八萬踰繕那。八功徳水盈滿其中。有𤘽勿頭華鉢頭摩華優鉢羅華芬荼利華。遍覆水上八功徳水者。一甘二冷三耎四輕五清淨六不臭七飮時不損喉八飮已不傷腹。自下七大海深量同前。大海中八功徳水四色蓮華准知第二山者。梵云伊沙馱羅山。此云持軸。峯如車軸。出水二萬踰繕那。厚量亦然。持軸山内海廣四萬踰繕那。八功徳水四色蓮華如前。第三山者。梵云竭地洛迦山。此寶樹名。似此方檐木。山上多此寶樹。從樹爲名。出水一萬踰繕那。厚量亦然。此山内海廣二萬踰繕那。"},{"id":"jujushin-00-0014","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"八功徳水四色蓮華如前。第四山者。梵云蘇達梨舍那。此云善見。見者稱善故。出水五千踰繕那。厚量亦然。善見山内海廣一萬踰繕那。八功徳水四色蓮華如前。第五山者。梵云頞濕縛羯拏。此云馬耳。山形似馬耳故。出水二千五百踰繕那。厚量亦然。馬耳山内海廣五千踰繕那。八功徳水四色蓮華如前。第六山者。梵云毘那恒迦山。此云象鼻。山形似象鼻故。出水一千二百五十踰繕那。厚量亦然。象鼻山内海廣二千五百踰繕那。八功徳水四色蓮華如前。第七山者。梵云尼民達羅山。此是魚名。山形似魚觜故也。出水六百二十五踰繕那。厚量亦然。此山内海廣一千二百五十踰繕那。八功徳水四色蓮華如前。第八山者。"},{"id":"jujushin-00-0015","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"梵云斫迦羅山。此云鐵圍。純鐵所成。入水如上。出水三百一十二半踰繕那。厚量亦然。鐵圍内海廣三億二萬二千踰繕那其水醎苦。於中大洲有四。中洲有八。小洲無數。人傍生餓鬼捺落迦等雜居其中。隨其業力所住各異四洲形數等頌瞻勝高洲量二千牛貨一洲餘五百車相半月地形勢畟方圓滿西北國一二五千壽與年六一二五丈尺量三品五戒及無我因縁相感現其像注。瞻部洲者從樹爲名。舊云閻浮提訛也。起世經云。閻浮樹下有閻浮那檀金聚。高二十由旬。南瞻部洲北廣南狹。三邊量等各二千由繕那。南邊唯廣三踰繕那半。人面亦然。智論云。持下品五戒則生其中。身長三肘半。凡肘量長一尺八寸即六尺三寸。或長四肘即七尺二寸。"},{"id":"jujushin-00-0016","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"自下肘量並准此。壽命百歳。唯此洲中有金剛座。上窮地際下踞金輪。一切菩薩皆登成覺。釋迦牟尼佛。示生迦毘羅衞國説三乘法。示滅拘尸那國雙樹涅槃。記法住云。正法千年像法一千五百年末法一萬年。中印土北有九黒山。北有雪山。雪山之北有香醉山。雪北香南有無熱惱池。縱廣五十踰繕那。池東銀牛口出殑伽河。池南金象口出信度河。池西瑠璃馬口出縛蒭河。池北頗胝師子口出徙多河。流入四海。其香山中無量緊那羅住。復有二窟乾闥婆王住。於此窟北有娑羅樹王。名爲善住。有八千樹周匝圍繞。中有象王亦名善住。與八千象而爲眷屬。瑜伽論云。與五百牝象而爲眷屬。毎月十五日往帝釋前侍衞行立。"},{"id":"jujushin-00-0017","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若閻浮提有輪王出最少一象而爲象寶。皆由餘福有是威神。二中洲者。正理論云。瞻部洲邊二中洲者。一名遮末羅。此云猫牛。多羅刹婆居。二名筏羅遮末羅。此云勝猫牛。亦有人住身形卑陋仁王經云。南閻浮提大國十六。中國五百。小國十千然四大洲同一日月。晝夜増減並有短長。准起世經。四時有異。南洲増勝。東西少別。北洲無異。不寒不熱節候調和也東毘提河洲者。此云勝身。舊云弗婆提訛也。起世經云。東弗婆提有一大樹。名迦曇婆。其本縱廣有七由旬。入地二十一由旬高百由旬。枝葉垂覆五十由旬。倶舍論云。三邊各有二千踰繕那。東邊三百五十踰繕那。地形如半月人面亦然。持中品五戒則生其中。身長八肘。"},{"id":"jujushin-00-0018","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"計一丈四尺四寸。壽命二百五十歳。釋迦如來諸聖弟子。至彼洲中説法化利。有修行者亦得果證。二中洲者。一名提訶此云勝。二名毘提訶此云勝身。皆有人住身形卑陋。西瞿陀尼洲者。起世經云。此云牛施。有一大樹名鎭頭迦。其本縱廣有七由旬。入地二十一由旬高百由旬。枝葉垂覆五十由旬。下有石牛高一由旬。故立名也。倶舍云。西牛貨洲周圓無缺。人面亦然。徑二千五百踰繕那。周圍三倍。持上品五戒則生其中。身長十六肘。計二丈八尺八寸。壽命五百歳。釋迦如來諸聖弟子。至彼洲中説法化利。有修行者亦得果證。二中洲者。一云舍𢮎此云諂。二云嗢怛羅縵怛里拏此云上儀。皆有人住身形卑陋。北倶盧洲者。"},{"id":"jujushin-00-0019","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"起世經云。欝怛羅究溜此云高上。地形畟方。四面各有二千踰繕那。人面亦方。持上品五戒十善修無我觀則生其中。身長三十二肘。計長五丈七尺六寸。定壽千歳。起世經云。有香樹衣樹取香取衣枝自垂下。衣食共用人無親疎。男女愛染共至樹下。若是所親樹枝如本。若非親者樹爲低枝。即爲彼人出百千敷具。隨意所爲歡娯受樂。大小便利地自開合。彼若命終必生欲天。輿屍道中無悲哭者。鳥名高逝從山飛來。銜死人髮遠置洲渚。於餘三洲最上高勝名欝單越。二中洲者。一炬柆婆此云勝邊。二憍柆婆此云有勝邊。皆有人住身形卑陋。如上洲等皆是人及鬼畜等所住處。如是一須彌一日月一四洲等爲一數至一千。是爲小千世界。"},{"id":"jujushin-00-0020","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"又以小千爲一數至千。是爲中千。又以中千爲一數至千。是爲三千大千世界。是則盧舍那所居千葉蓮華一葉也。一葉中有百億須彌百億日月百億四天下。如是千葉中各各有三千大千世界。是千箇三千大千世界中四洲等。皆是人趣等住處。如是十方有無量世界海。恐繁不述具説如別。此大洲中。増劫時出四種輪王。減劫時佛出現次明五趣。五趣者通於三界。順正理云。那落迦等下四趣全。及天一分謂六欲天。器及有情總名欲界。如是欲界總有二十處。地獄洲異分爲二十。八大地獄名地獄異。及四大洲。如是十二并六欲天傍生餓鬼。處成二十。若有情界。從自在天至無間獄。若器世界。乃至風輪是欲界攝。於三界中説有五趣。"},{"id":"jujushin-00-0021","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"唯於欲界有四趣全。三界各有天趣一分。云何爲五體名是何。謂前所説地獄傍生鬼及人天是爲五趣。善染無記有情無情及中有等皆是界性。趣體唯攝無覆無記。唯是有情而非中有。辨五名者。那落名人迦名爲惡。人多造惡蹎墜其中。由是故名那落迦趣。言傍生者舊云畜生。彼趣多分身横住故。又類多故多愚癡故。名曰傍生。言餓鬼者。謂餘生中憙盜他物習慳貪等。又多怯劣。其形痩悴身心輕躁。故名餓鬼。人者。多思慮故。天者。光明威徳皆熾盛故。下上界趣染善趣因。染中差別由十惡業。故正法念云。上者地獄。中者餓鬼。下者畜生。依此等文建立次第一明地獄趣。"},{"id":"jujushin-00-0022","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"寒熱二八大地獄頌地獄在何處孰觀自心中二八大人惡炎寒無信通烹爛似魚鳥炮炙何年窮刀劍如雨滴割臠幾許終人間三業過冥路多苦聚莫放身口業動招寒熱躬注。地獄者。順正理論云。此瞻部洲下過二萬踰繕那。有阿鼻旨。深廣同前謂各二萬故。彼底去此四萬踰繕那。餘七地獄在無間上。其七者何。一極熱。二炎熱。三大叫。四號叫。五衆合。六黒繩。七等活。八捺落迦増各十六。謂四門外各有四増。以非皆異名但標其定數。寒捺落迦亦有八種。一頞部陀。二尼頼部陀。三頞哳吒。四曤曤婆。五虎虎婆。六嗢鉢羅。七鉢特摩。八摩訶鉢特摩。此中有情嚴寒所逼。隨身聲瘡變立差別相名。謂二三三如其次第。此寒地獄。"},{"id":"jujushin-00-0023","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"在繞四洲輪圍山外極冥闇所。多由謗賢聖招如是苦果。有説。此皆在熱地獄傍。餘孤地獄或多二一各別業招。或近江河山間曠野。或在地下空中餘處。無間大熱及炎熱三。於中皆無獄卒防守。大叫號叫及衆合三少有獄卒。琰魔王使時時往來。巡擉彼故。其餘皆爲獄卒防守。有情無情異類獄卒防守。治罰罪有情故。一切地獄身形皆竪。初同聖語後漸乖訛。正法念經。十六別處各有異名。若造輕業即生別處。具造重業生根本中。此但略明八大地獄。八熱地獄因果嗢陀南等活殺善人黒繩加盜業衆合身三業號殺盜見酒大叫五種業炎熱由六種極熱由七惡無間五逆罪壽命與身量具説如經論注。等活者。正法念經云。"},{"id":"jujushin-00-0024","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若殺善人若受戒人若善行人。樂行多作普遍究竟。斷命根已心不生悔墮等活地獄。以四王天五百年爲彼一晝夜。乘此晝夜爲月爲年壽五百歳。取此晝夜。三十晝夜爲月。十二月爲年。壽五百歳。自下餘獄並是正法念經。所乘晝夜准此黒繩者。若人殺生偸盜善人財物。若受戒人若行善人樂行多作。盜離本處心不生悔墮黒繩地獄。以三十三天壽一千年爲彼一晝夜。乘此晝夜爲月爲年壽一千歳。衆合者。若人殺生偸盜邪行。樂行多作普遍究竟。若人邪行尊者之妻墮衆合地獄。以夜摩天二千年爲彼一晝夜。乘此晝夜爲月爲年壽二千歳。號叫者。若人殺盜邪見飮酒樂行多作。若以酒與衆僧若持戒人若禪定者。心即濁亂墮號叫地獄。"},{"id":"jujushin-00-0025","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"以都史多天四千年爲彼一晝夜。乘此晝夜爲月爲年壽四千歳。大叫者。若殺盜邪行飮酒妄語樂行多作。若王王等謂爲正直。二人諍對口不正説。失財斷命墮大叫地獄。以化樂天八千年爲彼一晝夜。乘此晝夜爲月爲年壽八千歳。炎熱者。若人堅重殺盜邪行飮酒妄語。復有邪見樂行多作。向他人説無施無捨善惡果報墮炎熱地獄。以他化天壽萬六千年爲彼一晝夜。乘此晝夜爲月爲年壽命一萬六千歳。極熱者。若有殺盜邪行飮酒妄語邪見。復於持戒淨行童子。善比丘尼未曾犯戒。令其退壞言無罪福墮大熱地獄。壽命半中劫。無間者。若人重心。殺母殺父出佛身血。破和合僧殺阿羅漢。墮阿鼻地獄。若造一逆乃至五逆。"},{"id":"jujushin-00-0026","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"長百由旬乃至五百由旬。受苦一倍乃至五倍。壽一中劫二明餓鬼趣。餓鬼趣頌慳心不散財定感餓身來涕唾無自在臨河炎火開前年可摘色骨立面如灰今日寒枯樹葉飛見者哀親親絶知問獨泣長夜臺分少割甘者居然脱此災注。諸鬼住處者。起世經云。當閻浮洲南鐵圍山外。有閻魔王宮殿住處。縱廣正等六千由旬。七寶所成。園苑行樹華果美妙衆鳥和鳴。不善果故。晝夜六時有赤融銅。諸宮殿等盡變爲鐵鉗。張王口寫銅。口中次第燋燃從下而出。部領諸鬼治罪人等。正理論云。諸鬼本住琰魔王國。從此展轉散趣餘方。此贍部洲南邊直下。深過五百由旬那量。有琰魔此云靜息王都。縱廣量亦爾。鬼有三種。謂無少多財。三各分三故成九類。"},{"id":"jujushin-00-0027","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"大勢鬼者。謂諸藥叉及羅刹娑恭畔荼等。所受富樂與諸天同。或依樹林或依靈廟。或居山谷或處空宮。諸鬼多分形竪而行。於劫初時皆同聖語。後隨處別種種乘訛。鬼以人間一月爲一日。乘此月歳壽五百年。正法念經云餓鬼世界住閻浮提下五百由旬。長三萬六千由旬。有三十六種。一切餓鬼皆爲慳嫉因縁所生。以種種心造種種業。爲飢渇火焚燒其身。人中十年爲一晝夜壽五百歳。此下不同略明八類然前二經瑜伽正理有多差別。"},{"id":"jujushin-00-0028","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"此下唯依正法念經餓鬼嗢陀南曰三十六種餓鬼等皆由慳嫉因業生人間一月爲一日乘此月歳五百年針口慳嫉雇殺人食吐夫婦惑妬食糞鬼慳惜施穢食無食枉人囚斷食水鬼灰酒不行施熾然奪財奉王臣欲色婬法不淨施魔身邪法謂眞諦注。針口鬼者。若人慳嫉。以財雇人令行殺戮。若夫令妻施沙門等。其婦慳惜實有言無。墮針口餓鬼中。壽命如前。食吐鬼者。若有婦人。誑有其夫自噉美食。或有丈夫妻無異心。便起妬意獨食美味。墮食吐餓鬼中。壽命如前。食糞鬼者。若人慳惜。以不淨食施沙門等。彼不知已而便食之。墮食糞餓鬼中。壽命如前。無食鬼者。若人慳嫉。自恃強力枉誣良善。繋之囹圄禁人糧食。令其致死不生悔恨。"},{"id":"jujushin-00-0029","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"墮無食餓鬼中。壽命如前。食水鬼者。若人沽酒。加水灰汁以惑愚人。不行布施不修福徳。不持禁戒作已不悔。墮食水餓鬼中。壽命如前。熾然鬼者。若人貪嫉。枉奪人財破人城郭。殺害人民抄掠得財。奉王大臣轉増凶暴。墮熾然餓鬼中。壽命如前。欲色鬼者。若男若女行婬女法。因此得財施非福田。不淨心施。墮欲色餓鬼中。世人説云如意夜叉。壽命如前。魔身鬼者。若行邪道説邪見法。謂是眞諦不信正法。墮魔羅身餓鬼中。若諸比丘行時食時。爲作妨礙惡聲惡夢。壽命如前三明畜生趣。"},{"id":"jujushin-00-0030","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"傍生趣頌畜生何處出本是愚癡人不辨黒與白任情亦任身無信賢聖誡寧知後世辛悠悠彼狂子此是傍生因強弱互爲食枉寃向誰陳式微彼已者莫放羝羊神注。順正理論云。傍生所止謂水陸空。生類顯形無邊差別。其身行相少竪多傍。如水羅刹娑及緊捺落等。雖傍生攝而形竪行。本住海中後流五趣。初同聖語後漸乖訛。正法念經云。觀諸畜生。種類差別有三十四億。隨心自在生於五道。於五道中畜生種類其數最多。種種相貌種種色類。行食不同。群飛各異。憎愛違順伴行雙隻同生共遊。然正法念及起世經正理瑜伽有多建立。憎愛恐怖四生四食行水陸空。因果寔繁難爲備擧。又難陀等雖是傍生。然其威徳勝諸天衆。阿素洛者與諸天衆。"},{"id":"jujushin-00-0031","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"違諍交通多諂曲故。或天鬼畜三趣中收。然正法念。修羅有二鬼及畜生。准論及經此分三種。雜類傍生龍修羅等。於初雜類。依正法念經略明七類。傍生嗢陀南傍生一趣類極多水陸空生形無邊怨對邪法邪論議蚖蛇烏鴟互殺害相隨愛心施結契必生鴛鴦鴿鳥等怖畏強賊破聚落後生麞鹿多怖中化生養蠶及殺蟲外道火祀生化生濕殺諸水蟲龜等邪見殺蟲祭天等三毒未斷得世通起瞋破國生卵生染心和合牛馬等邪見非禮生胎畜如是等類壽無定多分傍行故名之注。怨對者。若人邪見。習學邪法互相諍論。後生怨對畜生中還相殺害。所謂蚖蛇黄鼬馬。及水牛烏角鴟等。此類極多壽量無定。相隨者。若人爲生死故。行布施時尋共發願。"},{"id":"jujushin-00-0032","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"於當來世常爲夫妻。後生命命鴛鴦鴿鳥多樂愛欲。此類極多壽量無定。怖畏者。若人喜作強賊。撃鼓吹貝破壞聚落。作大音聲如諸恐怖。生麞鹿中心常恐怖。此類極多壽量無定。化生者。若人養蠶殺繭蒸煮水漬。生無量火髻蟲。有諸外道。取以火燒祀天求福。生化生畜生中。種種異類。此等極多壽量無定。濕生者。若人邪見。殺害龜蟞魚蟹蜯蛤池中細蟲酢中細蟲。或邪見事天殺蟲祭祀。生濕生畜生中。此類極多壽量無定。卵生因者。若人未斷貪欲瞋癡。修學禪定得世俗通。有因縁故起瞋恚心破壞國土。生卵生飛鳥鵰鷲等中。此類極多壽量無定。胎生者。若有衆生以愛欲心。和合牛馬令其交會。或令他人邪見非禮。生胎生畜生中。"},{"id":"jujushin-00-0033","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"此類極多壽量不定次明龍趣亦是傍生趣攝瞋火感龍趣嚴顏不可遇熱沙身上雨唼蟲鱗下聚皮膚幾銷脱毒氣數爲霧修羅挽索來金鳥搏翅附閻浮行不善非法作禍屡人道若無惡善龍泉下注割身猶可忍何況罵聲句可畏一瞋報長時不免懼注。起世經云。龍及金翅鳥各有四生。謂卵胎濕化。大海水下有娑伽羅龍王宮。縱廣八萬由旬七寶所成。園苑泉池衆鳥和鳴。佉低羅山此云持雙内海。有難陀憂波難陀二大龍宮。大海之北。爲諸龍王及金翅鳥生一大樹。名曰居吒奢摩離此云鹿聚其樹根本周七由旬。入地二十一由旬。高百由旬。遍覆五十由旬。其樹東面有卵生龍及卵生金翅鳥宮。南面有胎生龍及胎生金翅鳥宮。西面有濕生龍及濕生金翅鳥宮。"},{"id":"jujushin-00-0034","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"北面有化生龍及化生金翅鳥宮。此等諸宮。並皆縱廣六百由旬衆寶莊嚴。正法念經云。若多瞋癡生大海中深萬由旬龍所住城。名曰戲樂。縱廣正等三千由旬。龍王滿中。一者法行。二者非法行。一護世界二壞世間。法行龍王住處宮殿不雨熱沙。謂於前世受外道戒。行於布施而不清淨。以瞋恚心願生龍中。憶念福徳隨順法行無熱沙苦。然其頂上有龍蛇頭。其名曰七頭龍王象面龍王和修吉龍王徳叉迦龍王跋難陀龍王等。以善心故依時行雨。令諸世間五穀成就豐樂安隱。不降災雹信佛法僧。於四天下降澍甘雨。非法龍王所住之處。常雨熱沙焚燒宮殿及其眷屬。磨滅復生。其名曰惱亂龍王奮迅龍王黒色龍王多聲龍王。若諸衆生不行善法。"},{"id":"jujushin-00-0035","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"不孝父母不敬沙門。如是惡龍増長勢力。於四天下起惡雲雨。五穀不成能壞世間。若閻浮提人隨順法行。五十七億龍注於衆流。此依彼經略明二類。非法行龍王者。若人以瞋恚心。焚燒僧房聚落城邑。生大海中受毒龍身。迭共瞋惱吐毒相害。命極長者壽一中劫。法行龍王者。若人受外道戒。行不淨施持以揣食與惡戒者及諸賊人故生龍中。憶往福徳隨順法行。命極長者壽一中劫四明阿修羅。阿修羅頌諂曲憍心作布施命終必至修羅道心貪甘露寇天帝天帝誦經入蓮早日輪射眼放四光見月時遊憂陀嶋不忍四王如雨劍昇天還墜幾憂惱其身麁大踞山坐心性不直愛顛倒壽命八千不願出冥冥長夜徒生老注。起世經云。須彌山東過千由旬。"},{"id":"jujushin-00-0036","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"大海之下有鞞摩質多羅阿修羅王國土。縱廣正等八萬由旬。有一大樹名蘇質怛羅波吒羅。其本周圍滿七由旬。入地二十一由旬高百由旬。枝葉蔭覆五十由旬。其宮皆是七寶合成。園苑行樹衆鳥和鳴。其次復有一切諸小修羅等宮。正法念云。天之怨敵名阿修羅。略有二種。一鬼道所攝。二畜生所攝。鬼道攝者。魔身餓鬼有神通力。畜生攝者。住大海中羅睺阿修羅王。於欲界中化身大小隨意能作。時阿修羅思觀天女。雜色珠玉以爲甲胄。光明晃昱身如須彌。珍寶光明青黄赤黒。心大憍慢謂與天等。若閻浮提。不行正法不孝父母。不敬沙門不依法行。諸天勢力悉爲減少。若閻浮提修行正法。孝養父母恭敬沙門。一切諸天勢力増長。"},{"id":"jujushin-00-0037","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"時四天王即當修羅所住。空中雨諸刀劍。若天不出修羅欲昇。日出千光映障其目不見天宮。即擧右手以障日輪。手出四光青黄赤黒。閻浮提中邪見論師。不識業果妄言豐儉。又阿修羅行於海上見月。常遊憂陀延山。欲往昇天以手障月出四種光。諸呪術師妄言豐儉。或復修羅奮威縱怒震吼如雷。諸國相師言天獸下。妄言豐儉五穀貴賎。或言王者災變吉凶。或言兵起潔齋求福。當知皆是閻浮提中行善不善能感於斯。依正法念略明四地。第一地者。若婆羅門第一聰慧。於四交道施諸病人。見一佛塔惡人火燒救如來塔。而由無信常愛鬪戰。生羅睺阿修羅中。人間五百年爲彼一晝夜壽五千歳取此三十晝夜爲一月。十二月爲一年。壽五千歳。"},{"id":"jujushin-00-0038","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"下皆准知第二地者。若人作大施會。供養外道不行淨施。以種種食施於破戒雜行之人心無正思。如是施已生陀摩睺阿修羅中。人間六百年爲彼一晝夜壽六千歳。第三地者。若人因節會日種種博戲。因此得財行不淨施。以食施於破戒病人無心正思。如是施已生華鬘阿修羅中。人間七百年爲彼一晝夜壽七千歳。第四地者。若人邪見不識業果。見第一精進持戒人來。從其求乞乃施一食而作是言。汝下賎人有何福徳。生鉢呵婆阿修羅中。人間八百年爲彼一晝夜壽八千歳五擧人趣。人趣中有二種行。謂十種善惡。惡墮三途善昇三天。"},{"id":"jujushin-00-0039","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"十惡頌三途因業是十惡一業必爲五種因數取云爲動作咎誰知來世多苦辛身三口四意根本三毒蔓莚令人淪知過必改齊賢聖善男善女恕爲仁注。地持論云。殺生之罪能令衆生墮三惡道。若生人中得二種果報。一者短命。二者多病。如是十惡一一皆備五種果報。一者殺生何故受地獄苦。以其殺生苦衆生故。所以身壞命終。地獄衆苦皆來切己。二者殺生何故出爲畜生。以殺生無有慈惻行乖人倫故。地獄罪畢受畜生身。三者殺生何故復爲餓鬼。以其殺生必縁慳心貪著滋味復爲餓鬼。四者殺生何故生人而得短壽。以其殺生殘害物命故得短壽。五者殺生何故兼得多病。以殺生違適衆患競集故得多病。當知殺生是大苦也。又雜寶藏經云。"},{"id":"jujushin-00-0040","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"時有一鬼白目連言。我常兩肩有眼胸有口鼻常無有頭。何因縁故。目連答言。汝前世時恒作魁膾弟子。若殺人時汝常有歡喜心。以繩著髻挽之。以是因縁故受如此罪。此是惡行華報。地獄苦果方在後世也。復有一鬼白目連言。我身常如塊肉無有手脚眼耳鼻等。恒爲蟲鳥所食罪苦難堪。何因縁故爾。答言。汝前世時常與他藥墮他兒胎。是故受如此罪。此是華報。地獄苦果方在後身。又縁其殺生貪害滋多。以滋多故便無義讓而行劫盜。今身偸盜不與而取。死即當墮鐵窟地獄於遐劫中受諸苦惱。受苦既畢墮畜生中。身常負重驅蹙捶打無有餘息。所食之味唯以水草。處此之中無量生死。以本因縁若遇微善。劣復人身恒爲僕隸。"},{"id":"jujushin-00-0041","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"驅策走使不得自在償債未畢不得聞法。縁此受苦輪迴無窮。當知此苦皆縁偸盜。今身隱蔽光明。不以光明供養三寶。反取三寶光明以用自燃。死即當墮黒耳黒繩黒闇地獄於遐劫中受諸苦惱。受苦已畢隨蟣虱中不耐光明。在此之中無量生死。以本因縁若遇微善劣復人身。形容黶黒垢膩不淨。臭處穢惡人所厭遠雙眼盲瞎不覩天地。當知隱蔽光明亦縁偸盜故。故地持經云。劫盜之罪亦令衆生墮三惡道。若生人中得二種果報。一者貧窮。二者共財不得自在。劫盜何故墮於地獄。以其劫盜剥奪偸竊人財苦衆生故。身死即入寒氷地獄備受諸苦。劫盜何故出爲畜生。以其不行人道故。受畜生報身常負重。以肉供人償其宿債。何故復墮餓鬼。"},{"id":"jujushin-00-0042","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"縁以慳貪便行劫盜。是以畜生罪畢復爲餓鬼。何故爲人貧窮。縁其劫奪使物空乏所以貧窮。何故共財不得自在。縁其劫盜偸奪沒官若有財錢則爲五家所共不得自在。當知劫盜二大苦也。又雜寶藏經説。時有一鬼白目連言。大徳我腹極大如甕。咽喉手足甚細如針不得飮食。何因縁故受如此苦。目連答言。汝前世時作聚落主。自恃豪貴飮酒縱横輕欺餘人。奪其飮食飢困衆生。由是因縁受如此罪。此是華報。地獄苦果方在後也。復有一鬼白目連言。常有二熱鐵輪。在兩腋下轉身體燋爛。何因縁故爾。目連答言。汝前世時與衆僧作餅。盜取二番挾兩腋底。是故受如此罪。此是華報。後方受地獄苦果。又縁以盜故心不貞正恣情婬妷。"},{"id":"jujushin-00-0043","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"今身婬妷現世凶危常自驚恐。或爲夫主邊人所知。臨時得殃刀杖加刑。手足分離乃至失命。死入地獄臥之鐵床或抱銅柱。獄鬼燃火以燒其身。地獄罪畢當受畜生。雞鴨鳬雀犬豕飛蛾。如是無量生死。於遐劫中受諸苦惱。受苦既畢。以本因縁若遇微善劣復人身。閨門婬亂妻妾不貞。若有寵愛爲人所奪。常懷恐怖多危少安。當知危苦皆縁邪婬生也。故地持論云。邪婬之罪亦令衆生墮三惡道。若生人中得二種果報。一者婦不貞潔。二者不得隨意眷屬。邪婬何故墮於地獄。以其邪婬干犯非分侵物爲苦。所以命終受地獄苦。何故邪婬出爲畜生。以其邪婬不順人理。所以出獄受畜生身。何故邪婬復爲餓鬼。以其婬妷皆同慳愛。"},{"id":"jujushin-00-0044","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"慳愛罪故復爲餓鬼。何故邪婬婦不貞潔。縁犯他妻故所得婦常不貞正。何故邪婬不得隨意眷屬。以其邪婬奪人所寵故。其眷屬不得隨意。所以復爲人之所奪。當知邪婬三大苦也。如雜寶藏經説。昔有一鬼白目連言。我以物自蒙篭頭。亦常畏人來殺我。心常怖懼不可堪忍。何因縁故爾。答言。汝前世時。婬犯外色常畏人見。或畏其夫主捉縛打殺。或畏官法戮之都市常懷恐怖。恐怖相續故受如此罪。此是惡行華報。後方受地獄苦果。又縁其邪婬故發言皆妄。今身若妄苦惱衆生。死則當墮啼哭地獄於遐劫中受諸苦惱。受苦既畢墮餓鬼中。在此苦惱無量生死。以本因縁若遇微善劣復人身。多諸疾病尪羸虚弱頓乏楚痛。自嬰苦毒人不愛念。"},{"id":"jujushin-00-0045","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"當知此苦皆縁妄語生也。故地持論云。妄語之罪亦令衆生墮三惡道。若生人中得二種果報。一者多被誹謗。二者爲人所誑。何故妄語墮於地獄。縁其妄語不實使人虚爾生苦是以身死受地獄苦。何故妄語出爲畜生。以其欺妄乖人誠信。所以出獄受畜生報。何故妄語復爲餓鬼。縁其妄語皆同慳欺。慳欺罪故復爲餓鬼。何故爲人多被誹謗。以其妄語不誠實故何故妄語爲人所誑。以其妄語欺誑人故。當知妄語四大苦也。又縁其妄語使致兩舌。今身言無慈愛。讒謗毀辱惡口雜亂。死即當墮拔舌烊銅犂耕地獄。於遐劫中受諸苦惱。受苦既畢墮畜生中噉食糞穢。如鵜鶘鳥無有舌根。在此之中無量生死。以本因縁若遇微善劣復人身。"},{"id":"jujushin-00-0046","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"舌根不具口氣臭惡瘖瘂謇澁。齒不齊白滋歴疎少。脱有善言人不信用。當知讒亂皆縁兩舌生也。故地持論云。兩舌之罪亦令衆生墮三惡道。若生人中得二種果報。一者得弊惡眷屬。二者得不和眷屬。何故兩舌墮於地獄。縁其兩舌離人親愛。別離苦故受地獄苦。何故兩舌出爲畜生。縁其兩舌鬪亂事同野干受畜生身。何故兩舌復爲餓鬼。以其兩舌亦縁慳疾。慳疾罪故復爲餓鬼。何故兩舌爲人得弊惡眷屬。縁以兩舌使人朋儔皆生惡故。何故兩舌得不和眷屬。縁以兩舌離人親好使不和合故。當知兩舌五大苦也。又縁其兩舌言輒麁惡。今身縁以惡口故鬪亂殘害。更相侵伐殺諸衆生。死即當墮刀兵地獄於遐劫中受諸苦惱。受苦既畢墮畜生中。"},{"id":"jujushin-00-0047","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"拔脚賣膀輸𦚚喪髀。於遐劫中受諸苦惱。受苦既畢在此之中無量生死。以本因縁若遇微善。劣復人身四肢不具。閹刖剠劓形體殘毀。鬼神不衞人所輕棄。當知殘害衆生皆縁惡口生也。故地持論云。惡口之罪亦令衆生墮三惡道。若生人中得二種果報。一者常聞惡音。二者所可言説恒有諍訟。何故惡口墮於地獄。以所惡口皆欲害人人聞爲苦。所以命終受地獄苦。何故惡口出爲畜生。以其惡口罵人以爲畜生。所以出獄即爲畜生。何故惡口復爲餓鬼。縁其慳悋干觸惡詈。所以畜生苦畢復爲餓鬼。何故惡口爲人常聞惡音。以其發言麁鄙。所聞常惡口。何故惡口所可言説恒有諍訟。以其惡口違逆衆徳。有所説言常致諍訟。當知惡口六大苦也。"},{"id":"jujushin-00-0048","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"又縁其惡口言輒浮綺都無義益。無義益故今身即生憍慢。死即當墮束縛地獄於遐劫中受諸苦惱。受苦既畢墮畜生中。唯念水草不識父母恩養。在此之中無量生死。以本因縁若遇微善。劣復人身生在邊地。不知忠孝仁義不見三寶。若在中國短陋傴僂人所陵蔑。當知憍慢皆縁無義調戲不節生也。故地持論云。無義語罪亦令衆生墮三惡道。若生人中得二種果報。一者所有言語人不信受。二者有所言説不能明了。何故無義語墮於地獄。語既非義事咸損彼。所以命終受地獄苦。何故無義語出爲畜生。縁語無義人倫理乖。所以出地獄受畜生身。何故無義語復爲餓鬼。語無義故慳惑所障。因慳惑故復爲餓鬼。"},{"id":"jujushin-00-0049","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"何故無義語罪出生爲人有所言語人不信受。縁語無義非可承受。何故無義語有所言説不能明了。語既無義皆縁暗昧。暗昧報故不能明了。當知無義語七大苦也。又縁無義語故不能廉讓。使貪欲無厭。今身慳貪不布施。死即當墮沸屎地獄於遐劫中受諸苦惱。受苦既畢墮畜生餓鬼中。無有衣食資仰於人。所噉糞穢不與不得。在此之中無量生死。以本因縁若遇微善。劣復人身飢寒裸露困乏常無。人既不與求亦不得。縱有纖毫輒遇剥奪守苦無方亡身喪命。當知不布施皆縁貪欲生也。故地持論云。貪欲之罪亦令衆生墮三惡道。若生人中得二種果報。一者多欲。二者無有厭足。何故貪欲墮於地獄。縁其貪欲作動身口而苦於物。"},{"id":"jujushin-00-0050","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"所以身死受地獄苦。何故貪欲出爲畜生。縁此貪欲動乖人倫。是故出獄即爲畜生。是故貪欲復爲餓鬼。縁此貪欲得必貪惜。貪惜罪故復爲餓鬼。何故貪欲而復多欲。縁此貪欲所欲彌多。何故貪欲無有厭足。縁此貪欲貪求無厭。當知貪欲八大苦也。又縁貪欲不適意故。則有憤怒而起瞋恚。今身若多瞋恚者。死即當墮泥犁地獄於歴劫中具受衆苦。受苦既畢墮畜生中。作毒蛇蚖蝮虎豹犲狼。在此之中無量生死。以本因縁若遇微善。劣復人身復多瞋恚。面貌醜惡人所憎惡。非唯不與親友寶亦眼不喜見。當知忿恚皆縁瞋惱生也。故地持論云。瞋恚之罪亦令衆生墮三惡道。若生人中得二種果報。一者常爲一切求其長短。"},{"id":"jujushin-00-0051","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"二者常爲衆人之所惱害。何故瞋惱墮於地獄。縁此瞋惱恚害苦惱故受地獄苦。何故瞋惱出爲畜生。縁此瞋惱不能仁恕。所以出獄受畜生身。何故瞋惱復爲餓鬼。縁此瞋惱從慳心起。慳心罪故復爲餓鬼。何故瞋惱常爲一切求其長短。縁此瞋惱不能含容故。爲一切求其長短。何故瞋惱常爲衆人之所惱害。縁此瞋惱惱害於人人亦惱害。當知瞋惱九大苦也。又縁其瞋惱而懷邪僻不信正道。今身邪見遮人聽法誦經。自不飡採。死即當墮聾癡地獄於遐劫中受諸苦惱。受苦既畢墮畜生中。聞三寶四諦之聲不知是善。殺害鞭打之聲不知是惡。在此之中無量生死。以本因縁若遇微善。劣復人身生在人身。聾瞽不聞石壁不異。"},{"id":"jujushin-00-0052","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"美言善響絶不覺知當知岨礙聽法皆縁邪見生也。故地持論云。邪見之罪亦令衆生墮三惡道。若生人中得二種果報。一者生邪見家。二者其心諂曲。何故邪見墮於地獄。縁以邪見唯向邪道及以神俗。謗佛法僧不崇三寶。既不崇信斷人正路致令遭苦。所以命終入阿鼻獄。何故邪見復爲畜生。縁以邪見不識正理。所以出獄受畜生報。何故邪見復爲餓鬼。縁此邪見慳心慳著戻僻不捨。不捨慳著復爲餓鬼。何故邪見生邪見家。縁此邪見僻習纒心。所以爲人生邪見家。何故邪見其心諂曲。縁此邪見不中正故。所以爲人心常諂曲。當知邪見十大苦也。如是一一微細衆惡罪業無量無邊。皆入地獄備受諸苦。非可算數而知且略言耳。若能反惡爲善。"},{"id":"jujushin-00-0053","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"即是我師次明羝羊外道。諸外道嗢陀南時大相應二建者自在流出計尊貴自然内我執人量遍嚴壽者數取趣識藏知者及見者能所二執内外知怛梵人勝計常定顯生二聲與非聲如是三十大外道各各迷眞如輪轉注。大日經云復計有時者。謂計一切天地好醜皆以時爲因。如彼偈言。時來衆生熟。時至則催促。時能覺悟於人。是故時爲因。更有人言。雖一切人物非時所作。然時是不變因。是實有法細故不可見。以花實等果故可知有時。何以故見果知有因故。此時法不壞故常。亦以不觀時自性故。而生如是妄計也。經云地等變化者。謂地水火風虚空。各各有執爲眞實者。或言地爲萬物之因。以一切衆生萬物依地得生故。"},{"id":"jujushin-00-0054","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"以不觀地之自性但從衆縁和合有故。而生是見以爲供養地者當得解脱。次有計水能生萬物。火風亦爾。或計萬物從空而生。謂空是眞解脱因。宜應供養承事。皆應廣説。經云瑜伽我者謂學定者。計此内心相應之理以爲眞我。常住不動眞性湛然。唯此是究竟道離於因果。不觀心自性故。如是見生以爲眞我。但住此理即名解脱。經云建立淨不建立無淨者。是中有二種計。前句謂有建立一切法者。依此修行謂之爲淨。次句謂此建立非究竟法。若無建立所謂無爲乃名眞我亦離前句所修之淨。故云無淨也。猶不觀我之自性有如是見生。經云若自在天若流出及時者。謂一類外道計。自在天是常是自在者能生萬物。如十二門論中難云。"},{"id":"jujushin-00-0055","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若衆生是自在子者。唯應以樂遮苦不應與苦。亦應但供養自在則滅苦得樂。而實不爾。但自行苦樂因縁而自受報。非自在天作。又若自在作衆生者。誰復作此自在。若自在自作則不然。如物不自作。若更有作者則不名自在。計流出者。與建立大同。建立如從心出一切法。此中流出如從手功出一切法。譬陶師子埏埴無間生種種差別形相。次云時者。與前外道宗計少異。皆自在天種類也。經云尊貴者。此是那羅延天。外道計。此天湛然常住不動。而有輔相造成萬物。譬如人主無爲而治有司受命行之。以能造之主更無所尊貴者故名尊貴。又此宗計。尊貴者。遍一切地水火風空處。昔有論師。欲伏彼宗計故往詣天祠。"},{"id":"jujushin-00-0056","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"於彼天像身上坐而飮食。西方以飮食之殘爲極不淨皆共忿怒。論師言。如所宗豈非遍一切處地水火風空界相。答言如是。論師言。彼即地水火風我亦如是。以之相入何所不可而忿怒耶。彼衆默然不能加報。亦猶不觀我之自性故生如是妄計。經云自然者。謂一類外道計。一切法皆自然而有。無造作之者。如蓮華生色鮮潔誰之所染。棘刺利端誰所削成。故知諸法皆自爾也。有師難云。今目覩世人造作舟船室宅之類皆從衆縁而有。非自然成。云何自爾耶。若謂雖有而未明了故須人功發之。是亦不然。既須人功發之。即是從縁非自然有也。大唐所有老莊之教立天自然道。亦同此計。經云内我者。有計身中離心之外別有我性。"},{"id":"jujushin-00-0057","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"能運動此身作諸事業。難者云。若如是者我則無常。何以故。若法是因及從因生皆無常故。若我無常則罪福果報皆悉斷滅。如是等種種論議。至挍量中廣明。經云人量者。謂計神我之量等於人身身小亦小身大亦大。智度云。有計神大小隨人身。死壞時神亦前出。即與此向。然彼宗以我爲常住自在之法。今既隨身大小已是無常。故知不然也。經云遍嚴者。謂計此神我能造諸法然世間尊勝遍嚴之事是我所爲。與自在天計小異。如中論破自在云。自在天何故不盡作樂人盡作苦人。而有苦者樂者。當知從愛憎生故不自在。今遍嚴者。既能造諸福樂而不能以樂遮苦。何名遍嚴自在耶。經云若壽者。謂有外道計。"},{"id":"jujushin-00-0058","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"一切法乃至四大草木等皆有壽命也。如草木伐已續生當知有命。又彼夜則卷合。當知亦有情識以睡眠故。難者云。若見斬伐還生以爲有命。則人斷一支不復増長豈無命耶。如合昏木有眠則水流晝夜不息豈是常覺。皆由不觀我之自性故。生種種妄見也。經云補特伽羅。謂彼宗計有數取趣者。皆是一我但隨事異名耳。若有從今世趣於後世。是則識神爲常。識神若常云何有死生。死名此處滅生名彼處出。故不得言神常。若無常則無有我。如佛法中犢子道人及説一切有者。此兩部計有三世法。若定有過去未來現在。則同有數取趣者。失佛三種法印。西方諸菩薩。作種種量破彼宗計也。經云若識者。謂有一類執。此識遍一切處。"},{"id":"jujushin-00-0059","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"乃至地水火風虚空界識皆遍滿其中。此亦不然。若識神遍常應獨能見聞覺知。而今要由根塵和合方有識生。則汝識神爲無所用。又若識神遍五道中。云何復有死生耶。故知不爾也。經云阿頼耶者。是執持含藏義亦是室義。此宗説有阿頼耶能持此身。有所造作含藏萬像。攝之則無所有。舒之則滿世界。不同佛法中第八識義也。然世尊密意説如來藏爲阿頼耶。若佛法中人不觀自心實相。分別執著亦同我見也。經云知者見者。謂有外道計。身中有知者能知苦樂等事。復有計能見者即是眞我。智度云。目覩色名爲見者。五識知名爲知者。皆是我計隨事異名也。難者云。汝言能見是我而彼能聞能觸知者爲是我不。"},{"id":"jujushin-00-0060","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"若皆是者六根境界互不相知。一不可作六。六不可作一。若有非我者是亦同疑。故知根塵和合有所知見無別我也。經云能執所執。謂有外道言。身中離識心別有能執者。則是眞我。能運動身口作諸事業。或有説言。能執者但是識心。其所執境界乃名眞我。此我遍一切處。然内外身受心法性。皆從縁生無有自性。是中所執能執執尚不可得。何況我耶。亦猶不觀我之自性故作是説也。經云内知外知者。亦是知者別名。分爲二計。有計内知爲我。謂身中別有内證者即是眞我。或以外知爲我。謂能知外塵境界者即是眞我也。經云社怛梵者。云與知者外道宗計大同。但部黨別異故特出之耳。經云若摩奴闍者。智度翻爲人。即是人執也。"},{"id":"jujushin-00-0061","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"具譯當言人生。此是自在天外道部類。計人即從人生故以爲名。唐三藏云意生非也。末那是意。今云末奴。聲轉義別誤耳。經云摩納婆者。是毘紐天外道部類。正翻應云勝我。言我於身心中最爲勝妙也。彼常於心中觀我可一寸許。智度亦云。有計神在心中微細如芥子。清淨名爲淨色。或如豆麥乃至一寸。初受身時最在前受。譬如像骨及其成身如像已莊。唐三藏翻爲儒童非也。儒童梵云摩拏婆此云納。義別誤耳。經云常定生者。彼外道計我是常住不可破壞。自然常生無有更生。故以爲名。經云聲者。即是聲論外道。若聲顯者計。聲體本有。待縁顯之體性常住。若聲生者計。聲本生待縁生之生已常住。彼中復自分異計。如餘處廣釋。"},{"id":"jujushin-00-0062","work":"十住心論","source":"T77n2425 十住心論（提供テキスト由来・原典未照合）","juan":"第一","text":"非聲者。與前計有異。彼計聲是遍常。此宗悉撥爲無墮在無善惡法。亦無聲字處以此爲實也。楞伽經説百八部邪見。瑜伽論説十六計。智度説十六知見祕密漫荼羅十住心論卷第一終"},{"id":"hiyaku-00-0001","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"沙門遍照金剛撰悠悠悠悠太悠悠内外縑緗千萬軸杳杳杳杳太杳杳道云道云百種道書死諷死本何爲不知不知吾不知思思思思聖無心牛頭甞草悲病者斷菑機車愍迷方三界狂人不知狂四生盲者不識盲生生生生暗生始死死死死冥死終至如空華眩眼龜毛迷情。謬著實我醉心封執。渇鹿野馬奔於塵郷。狂象跳猿蕩於識都。遂使十惡快心日夜作。六度逆耳不入心。謗人謗法不顧燒種之辜。耽酒耽色誰覺後身之報。閻魔獄卒構獄斷罪。餓鬼禽獸焔口挂體。輪廻三界跉跰四生。大覺慈父觀此何默。是故設種種藥指種種迷。意在此歟於焉修三綱五常則君臣父子之道有序不亂。習六行四禪則厭下欣上之觀勝進得樂。唯蘊遮我八解六通。"},{"id":"hiyaku-00-0002","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"因縁修身空智拔種。無縁起悲唯識遣境則二障伏斷四智轉得。不生覺心獨空慮絶則一心寂靜不二無相。觀一道於本淨觀音熈怡。念法界於初心普賢微咲。心外礦垢於此悉盡。曼荼莊嚴是時漸開。m@a@t@u惠眼破無明之昏夜。日月定光現有智之薩埵。五部諸佛擎智印森羅。四種曼荼住法體駢塡。阿遮一睨業壽之風定。多撃三喝無明之波涸。八供天女起雲海於妙供。四波定妃受適悦於法樂。十地不能窺窬。三自不得齒接。祕中之祕覺之又覺。吁吁不知自寶狂迷謂覺非愚而何。考慈切心非教何濟。投藥在此不服何療。徒論徒誦醫王呵叱。爾乃九種心藥拂外塵而遮迷。金剛一宮排内庫而授寶。樂不樂得不得自心能爲。"},{"id":"hiyaku-00-0003","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"非哥非杜我心自證而已。求佛薩埵不可不知。摩尼燕石驢乳牛醐。不可不察。不可不可察。住心深淺經論明説具列如後。"},{"id":"hiyaku-00-0004","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"頌曰歸命金剛内外壽離言･垢過･等空･因作遷慢如眞乘寂制體籏光蓮唄仁日幢華眼鼓勃駄金寶法業歌舞人揑鑄剋業威儀等丈夫無礙過刹塵我今蒙詔撰十住頓越三妄入心眞褰霧見光無盡寶自他受用日彌新軷祖求伽梵幾郵到本床如來明説此十種入金場已聽住心數請開彼名相心名後明列諷讀悟迷方第一異生羝羊心凡夫狂醉不悟吾非但念婬食如彼羝羊第二愚童持齋心由外因縁忽思節食施心萌動如穀遇縁第三嬰童無畏心外道生天暫得蘇息如彼嬰兒犢子隨母第四唯蘊無我心唯解法有我人皆遮羊車三藏悉攝此句第五拔業因種心修身十二無明拔種業生已除無言得果第六他縁大乘心無縁起悲大悲初發幻影觀心唯識遮境第七覺心不生心八不絶戲一念"},{"id":"hiyaku-00-0005","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"觀空心原空寂無相安樂第八如實一道心一如本淨境智倶融知此心性號曰遮那第九極無自性心水無自性遇風即波法界非極蒙警忽進第十祕密莊嚴心顯藥拂塵眞言開庫祕寶忽陳萬徳即證第一異生羝羊心異生羝羊心者何。凡夫狂醉不辨善惡。愚童癡暗不信因果之名也。凡夫作種種業感種種果。身相萬種而生。故名異生。愚癡無智均彼羝羊之劣弱。故以喩之。夫生非吾好死亦人惡。然猶生之生之輪轉六趣。死去死去沈淪三途。生我父母不知生之由來。受生我身亦不悟死之所去。顧過去冥冥不見其首。臨未來漠漠不尋其尾。三辰戴頂暗同狗眼。五嶽載足迷似羊目。營營日夕繋衣食之獄。趁逐遠近墜名利之坑。加以磁石吸鋼則剛柔馳逐。"},{"id":"hiyaku-00-0006","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"方諸招水則父子相親。父子親親不知親之爲親。夫婦相愛不覺愛之爲愛。流水相續飛焔相助。徒縛妄想之繩空醉無明之酒。既如夢中之遇還似逆旅之逢。泊如一二從道而展生。萬物因土而森羅。自在能生梵天所作未知生人之本誰談死者之起。遂乃豺狼狻虎咀嚼於毛物。鯨鯢摩竭呑歠於鱗族。金翅食龍羅刹喫人。人畜相呑強弱相噉。況復弓箭亙野猪鹿之戸絶種。網罭篭澤魚鼈之郷滅族。鷹隼飛而鷩鵠流涙。敖犬走而狐㝹斷腸。禽獸盡心未飽。厨屋滿舌不厭。強竊二盜迷珍財而受戮。和強兩姧惑娥眉而殺身。四種口業任舌作斧。三箇意過縱心自毒。無慚無愧八萬之罪盡作。自作教他塵沙之過常爲。都不覺知一一罪業招三惡之苦。"},{"id":"hiyaku-00-0007","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"一一善根登四徳之樂。有云。人死歸氣更不受生。如此之類名斷見。有云。人常爲人畜常爲畜。貴賎常定貧富恒分。如此之類名常見。或持牛狗戒。或投死恒河。如此之類曰邪見。邪見外道其數無量。不知出要祖習妄見。如是等類皆悉羝羊之心也。頌曰凡夫盲善惡不信有因果但見眼前利何知地獄火無羞造十惡空論有神我封著愛三界誰脱煩惱鎖問。依何論建立此義。答。大日經。彼經何説。經云。祕密主。無始生死愚童凡夫。執著我名我有分別無量我分。祕密主。若彼不觀我之自性。則我我所生。餘復討有時地等變化。瑜伽我。建立淨･不建立無淨。乃至聲･非聲。祕密主。如是等我分。自昔以來分別相應希求順理解脱。祕密主。"},{"id":"hiyaku-00-0008","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"愚童凡夫類猶如羝羊。龍猛菩提心論云。謂凡夫執著名聞利養資生之具。務以安身恣行三毒五欲。眞言行人誠可厭患誠可棄捨第二愚童持齋心夫禿樹非定禿。遇春則榮花。増氷何必氷。入夏則泮注。穀牙待濕卉菓結時。至如戴淵改心周處忠孝。礦石忽珍魚珠照夜。物無定性人何常惡。遇縁則庸愚庶幾大道。順教則凡夫思齊賢聖。羝羊無自性愚童亦必不愚。是故本覺内薫佛光外射欻爾節食數數檀那。牙種疱葉之善相續而生。敷花結實之心探湯不及。五常漸習十善鑚仰。言五常者仁義禮智信。仁名不殺等恕己施物。義則不盜等積而能施。禮曰不邪等五禮有序。智是不亂等審決能理。信不妄之稱言而必行。"},{"id":"hiyaku-00-0009","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"能行此五則四序玉燭五才金鏡。國行之則天下昇平。家行之則路不拾遺。擧名顯先之妙術保國安身之美風。外號五常内名五戒。名異義融行同益別。斷惡修善之基漸脱苦得樂之濫觴。故經云。下品五戒生贍部洲。中品五戒勝身國。上品牛貨。上上及無我欝單越。廣説之。四洲人民各有王者。王有五種。粟散･四輪王。此五種王必乘十善而來御。故仁王經云。十善菩薩發大心。長別三界苦輪海。中下品善粟散王。上品十善鐵輪王。習種銅輪二天下。銀輪三天性種性。道種堅徳轉輪王。七寶金輪四天下。今案此文王者及民必行五戒十善得生人中。未有棄此能得。前生修善今生得人。此生不修還墜三途。春種不下秋實何獲。"},{"id":"hiyaku-00-0010","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"善男善女不可不仰不可不仰。十惡十善之報。聖王凡王之治。具如十住心論。頌曰愚童少解貪瞋毒欻爾思惟持齋美種子内熏發善心牙疱相續尚英軌五常十善漸修習粟散輪王仰其旨問此住心亦依何經説。答大日經。彼經何説。經云。愚童凡夫或時有一法想生。所謂持齋。彼思惟此少分發起歡喜數數修習。祕密主。是初種子善業發生。復以此爲因於六齋日施與父母男女親戚是第二牙種。復以此施授與非親識者是第三疱種。復以此施與器量高徳者是第四葉種。復以此施歡喜授與伎樂人等及獻尊宿是第五敷花。復以此施發親愛心而供養之是第六成果第三嬰童無畏心嬰童無畏心者。外道厭人凡夫欣天之心也雖云上生非想下住仙宮。"},{"id":"hiyaku-00-0011","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"身量四萬由旬壽命八萬劫。厭下界如瘡瘀見人間如蜉蝣。光明蔽日月福報超輪王。然猶比彼大聖劣弱愚朦似此咳兒。脱少分厄縛故無畏。未得涅槃樂故嬰童。問聞噵淮犬高踏。費龍遠飛。並是藥力所致師術所爲。今此天等依何教就誰師。能得如此自在光明身壽命長遠樂。又天有幾種請示其名。高問來叩鐘谷何默。嘗試論之。夫狂毒不自解醫王能治。摩尼不自寶工人能營。所謂醫王工人豈異人乎。我大師薄伽梵其人也。如來徳具萬種。一一徳即一法門之主也。從彼一一身隨機根量説種種法度脱衆生。故大日經云。如來應供正遍知得一切智智爲無量衆生廣演分布。隨種種趣種種性欲。種種方便道宣説一切智智。或聲聞乘道。"},{"id":"hiyaku-00-0012","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"或縁覺乘道。或大乘道。或五通智道。或願生天。或生人中及龍夜叉乾闥婆。乃至説生摩睺羅伽法云云今依此文三乘及人天乘教並皆如來所説。若依教修行者必生天上。問若然者諸外道等所行皆是佛法歟。答。此有二種一合。二違。合者契合如來所説故。違者違乖佛説故。雖云元是佛説。然無始時來展轉相承違失本旨。或隨自見持牛狗等戒以求生天。如是之類並失本意。問。若是佛説者宜直説佛乘等。何用説天乘等。機根契當故。餘藥無益故。問。已聞師及教。請示天數。天有三種謂欲･色･無色界是。初欲界有六天。四王･忉利･夜摩･都史･樂變化･他化自在是也。色界有十八。此有四別四禪各別故。初禪有三。"},{"id":"hiyaku-00-0013","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"梵衆梵輔大梵是。二禪有三少光･無量光･極光淨是。三禪又三。少淨･無量淨･遍淨是也。第四禪有九天。無雲･福生･廣果･無想･無煩･無熱･善見･善現･色究竟是也。無色界有四。空無邊･識無邊･無處有處･非想非非想是也。此是二十八種天去海遠近身量大小壽命長短等。具如十住心論。恐繁不述問。既聞天名數重請示彼行相。答。諸外道等亦立三寶三學等名。梵天等爲覺寶。四吠陀論等爲法寶。傳授修行者爲僧寶。十善等爲戒。四禪那即定。此定由六行而得。六行者言苦麁障淨妙離是。厭下界作苦麁障想。欣上天作淨妙離觀。由此觀故展轉上生。由他主空三昧空惠發生。由此三學得上天妙樂。"},{"id":"hiyaku-00-0014","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"雖然道非究竟故不能出生死得涅槃。上射非想還墜地獄。譬如箭射虚空力盡即下。是故不可樂求。問。諸外道同修三學生彼二界。證空三昧言亡慮絶。何由不得斷煩惱證涅槃。觀著二邊定帶二見故。問。同觀非有非無。何墮二邊二見乎。繋屬他主不知因縁中道故。因縁中道其意云何。觀因縁有故不墮斷邊。觀自性空故不墜常見。觀有空即法界即得中道正觀。由此中道正觀故早得涅槃。外道邪見人不知此義。是故不得眞圓寂。若聞此理即得羅漢。問。護戒生天有幾種。生天有四種。一外道如前説。二二乘亦生天上。三大乘菩薩必爲十天王故。四應化諸佛菩薩化作天王故。具如十住心論説。"},{"id":"hiyaku-00-0015","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"頌曰外道發心願天樂虔誠持戒覔歸依不知大覺圓滿者豈悟梵天龍尊非六行修觀生無色身心五熱徒自嘰斷常空有願勝住若遇世尊覺我違問。今此住心亦依何經論解説。答。大日經菩提心論。彼經何説。彼經云。祕密主彼護戒生天是第七受用種子。復次祕密主以此心生死流轉。於善友所聞如是言此是天大天與一切樂者。虔誠供養一切所願皆滿。所謂自在天･梵天･那羅延天･商羯羅天･自在天子･日天･月天･龍尊等。乃至或天仙･大圍陀論師。各各應普供養。彼聞如是心懷慶悦。慇重恭敬隨順修行。祕密主是名愚童異生生死流轉無畏依第八嬰童心。又云。復次殊勝行隨彼所説中殊勝住求解脱惠生。謂常無常空。隨順如是説。"},{"id":"hiyaku-00-0016","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"上","text":"祕密主非彼知解空･非空常･斷。非有非無倶彼分別無分別。云何分別空。不知諸空非彼能知涅槃。是故應了知空離於斷常解云。外道願出要種種苦身心。斷常空有教如搆角求乳。若知因縁空忽爾得解脱又云。祕密主世間因果及業若生若滅繋屬他主空三昧生。是名世間三昧道。又云。若諸天世間眞言法教道如是勤勇者爲利衆生故。龍猛菩薩菩提心論云。諸外道等戀其身命或助以藥物得仙宮住壽。或復生天以爲究竟。眞言行人應觀彼等。業力若盡未離三界煩惱尚存。宿殃未殄惡念旋起。當彼之時沈淪苦海難可出離。當知。外道之法。亦同幻夢陽焔也"},{"id":"hiyaku-01-0001","work":"秘藏寶鑰","source":"T77n2426 秘藏寶鑰（提供テキスト由来・原典未照合）","juan":"中","text":"第四唯蘊無我心若夫鉛刀終無鏌耶之績。泥蛇豈有應龍之能。燕石濫珠璞鼠名渉。名實相濫由來尚矣。然則勝數諦名梵延佛號。長爪實相犢子絶言。徒勞解脱之智未知涅槃之因。是故大覺世尊説此羊車。拔出三途之極苦解脱八苦之業縛。其爲教也。三藏廣張四諦普觀。三十七品爲道助四向四果即人位。言識唯六無七八。告成三生六十劫防非則二百五十。修善即四念八背。半月説罪持犯立顯。一夏隨意凡聖乍別。禿頭割衣鐵杖鋼盂。行則安徐護虫。坐則低頭數息。斯則"},{"id":"kenmitsu-00-0001","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"夫佛有三身教則二種。應化開説名曰顯教。言顯略逗機。法佛談話謂之密藏。言祕奥實説。顯教契經部有百億。分藏則有一十五十一之差。言乘則有一二三四五之別。談行六度爲宗。告成三大爲限。是則大聖分明説其所由。若據祕藏金剛頂經説。如來變化身爲地前菩薩及二乘凡夫等説三乘經法。他受用身爲地上菩薩説顯一乘等。並是顯教也。自性受用佛自受法樂故與自眷屬各説三密門。謂之密教。此三密門者。所謂如來内證智境界也。等覺十地不能入室。何況二乘凡夫誰得昇堂。故地論釋論稱其離機根。唯識中觀歎言斷心滅。如是絶離並約因位談非謂果人也。何以得知。經論有明鑒故。其明證具列如後。求佛之客庶曉其趣。"},{"id":"kenmitsu-00-0002","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"縱使觸顯網以羝䉒壅權關以税駕。所謂息城之賓。愛楊葉兒。何能得保無盡莊嚴恒沙己有。至如棄醍醐而覓牛乳。擲摩尼以拾魚殊。寂種之人膏盲之病醫王拱手甘雨何益。若有善男子善女人一嗅斯芸。秦鏡照心權實氷解。所有明證。雖經論至多。且示一隅。庶有裨於童幼問曰。古傳法者廣造論章。唱敷六宗開演三藏。軸剩廣厦人僵卷舒。何勞綴斯篇。利益如何答。多有發揮所以應纂。先匠所傳皆是顯教。此是密藏人未多解。是故戈釣經論今爲一手鏡問。顯密二教其別如何答。他受用應化身隨機之説謂之顯也。自受用法性佛説内證智境是名祕也問。應化身説法諸宗共評。如彼法身無色無像。言語道斷心行處滅無説無示。"},{"id":"kenmitsu-00-0003","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"諸經共説斯義。諸論亦如是談。如今何儞談法身説法。其證安在乎答。諸經論中往往有斯義。雖然文隨執見隱。義逐機根現而已。譬如天鬼見別人鳥明暗問。若如汝説諸教中有斯義。若如是者何故前來傳法者不談斯義答。如來説法應病投藥。根器萬差針灸千殊。隨機之説權多實少。菩薩造論隨經演義不敢違越。是故天親十地馳因分可説之談。龍猛釋論挾圓海不談之説。斯則隨經興詞非究竟唱。雖然傳顯法將會深義而從淺。遺祕旨而未思。師師伏膺隨口蘊心。弟弟積習隨宗成談。爭募益我之鉾未遑訪損己之劍。加以釋教漸東夏自微至著。漢明爲始周天爲後。其中間所翻傳皆是顯教。玄宗代宗之時金智廣智之日。密教欝起盛談祕趣。"},{"id":"kenmitsu-00-0004","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"新藥日淺舊痾未除。至如楞伽法佛説法之文。智度性身妙色之句。馳胸憶而會文。驅自宗而取義。惜哉古賢不甞醍醐問。義若如是者何等經論説顯密差別答曰。五祕金峯聖位經。遮那楞伽教王等。菩提智度摩訶衍。如是經論簡擇説問者曰。請聞其證答曰。然矣。我當爲汝飛日輪而破暗。揮金剛以摧迷。問者曰。唯唯欲聞龍猛菩薩釋大衍論云。一切衆生從無始來。皆有本覺無捨離時。何故衆生先有成佛後有成佛今有成佛。亦有勤行亦有不行。亦有聰明亦有暗鈍。無量差別。同有一覺皆悉一時發心修行到無上道。本覺佛性強劣別故如是差別。無明煩惱厚薄別故如是差別。若言如初者此事則不爾。所以者何。"},{"id":"kenmitsu-00-0005","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"本覺佛性圓過恒沙之諸功徳無増減故。若言如後者此事亦不爾。所以者何。一地斷義不成立故。如是種種無量差別皆依無明而得住持。於至理中無關而已。若如是者一切行者。斷一切惡修一切善。超於十地到無上地。圓滿三身具足四徳。如是行者爲明無明。如是行者無明分位非明分位。若爾淸淨本覺從無始來不觀修行非得他力。性徳圓滿本智具足。亦出四句亦離五邊。自然之言不能自然。淸淨之心不能淸淨。絶離絶離。如是本處爲明無明。如是本處無明邊域非明分位。若爾一法界心非百非背千是。非中非中背天背天。演水之談足斷而止。審慮之量手亡而住。如是一心爲明無明。如是一心無明邊域非明分位。三自一心摩訶衍法。"},{"id":"kenmitsu-00-0006","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"一不能一假能入一。心不能心假能入心。實非我名。而立曰。我亦非自唱而契於自。如我立名而非實我。如自得唱而非實自。玄玄又玄遠遠又遠。如是勝處爲明トヤ無明カ。如是勝處無明邊域非明分位。不二摩訶衍法唯是不二摩訶衍法。如是不二摩訶衍法爲明トヤ無明カ喩曰。已上五重問答甚有深意。細心研覈乃能詣極。一一深義不能染紙。審而思之又曰。何故不二摩訶衍法無因縁耶。是法極妙甚深獨尊。離機根故。何故離機根。無機根故。何須建立。非建立故。是摩訶衍法諸佛所得耶。能得於諸佛。諸佛得不故。菩薩二乘一切異生亦復如是。性徳圓滿海是焉。所以者何。離機根故。離教説故。八種本法從因縁起。應於機故。"},{"id":"kenmitsu-00-0007","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"順於説故。何故應機。有機根故。如是八種法諸佛所得耶。諸佛所得。得於諸佛。不故。菩薩二乘一切異生亦復如是。修行種因海是焉。所以者何。有機根故。有教説故。又云。諸佛甚深廣大義者。即是通總攝前所説門。所謂通攝三十三種本數法故。此義云何。言諸佛者即是不二摩訶衍法。所以者何。此不二法形於彼佛其徳勝故。大本花嚴契經中作如是説。其圓圓海徳諸佛勝。其一切佛不能成就圓圓海劣故。若爾何故分流花嚴契經中作如是説。盧舍那佛三種世間爲其身心。三種世間攝法無餘。彼佛身心亦復無有所不攝焉。盧遮那佛雖攝三世間。而攝不攝故。是故無過喩曰。所謂不二摩訶衍及圓圓海徳諸佛者即是自性法身。"},{"id":"kenmitsu-00-0008","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"是名祕密藏。亦名金剛頂大教王。等覺十地等不能見聞故得祕密號。具如金剛頂經説華嚴五教第一卷云。今將開釋迦佛海印三昧一乘教義略作十門。初明建立一乘者。然此一乘教義分齊開爲二門。一別教二同教。初中亦二。一是性海果分。當是不可説義。何以故。不與教相應故。即十佛自境界也。故地論云因分可説果分不可説者是也。二是縁起因分即普賢境界也。又中卷十玄縁起無礙法門義云。夫法界縁起乃自在無窮。今以要門略攝爲二。一者明究竟果證義。即十佛自境界也。二者隨縁約因辯教義。即普賢境界也。初義者圓融自在一即一切一切即一。不可説其状相耳。如花嚴經中究竟果分國土海及十佛自體融義等者即其事也。"},{"id":"kenmitsu-00-0009","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"不論因陀羅及微細等。此當不可説義。何以故。不與教相應故。故地論云因分可説果分不可説者即其義也問。義若如是何故經中乃説佛不思議品等果耶答。此果義是約縁形對爲成因故説此果。非據究竟自在果。所以然者爲不思議法品等與因位同會而説故。知形對耳。又云問。上言果分離縁不可説相但論因分者。何故十信終心即辯作佛得果法也答。今言作佛者。但初從見聞已去。乃至第二生即成解行。解行終心因位窮滿者。於第三生即得彼究竟自在圓融果矣。由此因體依果成故。但因位滿者勝進即沒於果海中。爲是證境界故不可説耳喩曰。十地論及五教性海不可説文。與彼龍猛菩薩不二摩訶衍圓圓性海不可説言懸會。"},{"id":"kenmitsu-00-0010","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"所謂因分可説者顯教分齊。果性不可説即是密藏本分也。何以知然。金剛頂經分明説故。有智者審思之天台止觀第三卷云。此三諦理不可思議無決定性實不可説。若爲縁説不出三意。一隨情説即隨他意語二隨情智説即隨自他意語三隨智説即隨自意語云何隨情説三諦。如盲不識乳爲説具粖雪鶴四譬。四盲各各作解執起四諍。凡情愚翳亦復如是。不識三諦大悲方便而爲説有門空門空有門非空非有門。是諸凡夫終不能見常樂我淨眞實之相。各執空有互相是非如彼四盲所以常途解二諦者二十三家。家家不同各各異見執自非他。雖飮甘露傷命早夭云云隨智説三諦者。從初住去非但説中絶於視聽。眞俗亦然。三諦玄微唯智所照。"},{"id":"kenmitsu-00-0011","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"不可示不可思。聞者驚怪。非内非外非難非易。非相非非相非是世法無有相貌。百非洞遣四句皆亡。唯佛與佛乃能究盡。言語道斷心行處滅。不可以凡情圖想。若一若三皆絶情望尚非二乘所測。何況凡夫。如乳眞色眼開乃見。徒費言語盲終不識。如是説者名爲隨智説三諦相。即是隨自意語也喩曰。此宗所觀不過三諦。一念心中即具三諦。以此爲妙。至如彼百非洞遣四句皆亡。唯佛與佛乃能究盡。此宗他宗以此爲極。此則顯教關楔。但眞言藏家以此爲入道初門不是祕奥。仰覺薩埵不可不思楞伽經云。佛告大惠。我爲曾行菩薩行諸聲聞等依無餘涅槃而與授記。大惠我與聲聞授記者。爲怯弱衆生生勇猛心。大惠此世界中及餘佛國。"},{"id":"kenmitsu-00-0012","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"有諸衆生行菩薩行而復樂聲聞法行。爲轉彼心取大菩提。應化身佛爲應化聲聞授記。非報佛法身佛而授記莂喩曰。依此文法華經者是應化佛所説。何以故。爲應化聲聞等佛授記莂故。或者談法身説。甚誣罔而已慈恩法師二諦義云。瑜伽唯識二諦各有四重。世俗諦四名者。一世間世俗諦亦名有名無實諦二道理世俗諦亦名隨事差別諦三證得世俗諦亦名方便安立諦四勝義世俗諦亦名假名非安立諦勝義諦四名者。一世間勝義諦亦名體用顯現諦二道理勝義諦亦名因果差別諦三證得勝義諦亦名依門顯實諦四勝義勝義諦亦名廢詮談旨諦前之三種名安立勝義諦。第四一種非安立勝義諦。又云。勝義勝義者。體妙離言逈超衆法名爲勝義。"},{"id":"kenmitsu-00-0013","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"聖智内證過前四俗復名勝義諦。又云。第四勝義勝義諦者。謂非安立廢詮談旨一眞法界也喩曰。此章中勝義勝義廢詮談旨聖智内證一眞法界體妙離言等。如是絶離即是顯教分域。言因位人等四種言語皆不能及。唯有自性法身以如義眞實言能説是絶離境界。是名眞言祕密教。金剛頂等經是也智度論第五云。不生不滅不斷不常不一不異不去不來。因縁生法滅諸戲論。佛能説是我今當禮。乃至諸法不生不滅非不生非不滅。非非不生滅亦非非非不生滅。已得解脱非空非不空。如是等捨滅諸戲論。言語道斷深入佛法。心通無礙不動不退名無生忍。是助佛道初門又三十一云。復次離有爲則無無爲。所以者何。有爲法實相即是無爲。"},{"id":"kenmitsu-00-0014","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"無爲相者則非有爲。但爲衆生顛倒故。分別説有爲相者生滅住異。無爲相者不生不滅不住不異。是爲入佛法之初門。龍猛菩薩般若燈論觀涅槃品頌云彼第一義中佛本不説法佛無分別者説大乘不然化佛説法者是事則不然佛無心説法化者非是佛於第一義中彼亦不説法無分別性空有悲心不然衆生無體故亦無有佛體彼佛無體故亦無悲愍心分別明菩薩釋云。此中明第一義者。一相故所謂無相。無佛亦無大乘。第一義者是不二智境界。汝説偈者正是説我佛法道理。今當爲汝説如來身。如來身者雖無分別。以先種利他願力。爲大誓莊嚴熏修故。能攝一切衆生。於一切時起化佛身。因此化身有文字章句次第出聲。不共一切外道聲聞辟支佛故。"},{"id":"kenmitsu-00-0015","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"而爲開演二種無我。爲欲成就第一義波羅蜜故。爲欲成就最上乘者故。名爲大乘。有第一義佛故。依止彼佛而起化身。從此化身起於説法。由第一義佛爲説法因故。不壞我所立義。亦不壞世間所欲。又云。第一義中如幻如化。誰説誰聽。以是故如來無處所。無一法爲説。又觀邪見品云。般若中説。佛告勇猛極勇猛菩薩。知色非起見處亦非斷見處。乃至受想行識非起見處亦非斷見處者。是名般若波羅蜜。今以無起等差別縁起令開解者。所謂息一切戲論及一異等種種見悉皆寂滅。是自覺法。是如虚空法。是無分別法。是第一義境界法。以如是等眞實甘露而令開解。是一部論宗喩曰。今依斯文。明知。"},{"id":"kenmitsu-00-0016","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"中觀等息諸戲論寂滅絶離以爲宗極。如是義意皆是遮情之門。不是表徳之謂。論主自斷入道初門。有意智者留心九思之龍樹菩薩大智度論三十八云。佛法中有二諦。一者世諦。二者第一義諦。爲世諦故説有衆生。爲第一義諦故説衆生無所有。復有二種。有知名字相。有不知名字相。譬如軍立密號有知者有不知者。復有二種。有初習行有久習行。有著者有不著者。有知他意有不知他意者離有言辭知其寄言以自宣理爲不知名字相初習行著者不知他意者故説無衆生。爲知名字相久習行不著知他意者故説言有衆生喩曰。初重二諦與常談同。次二諦有八種人。爲不知名字相等四人説眞諦中無佛無衆生。爲後四人故説眞諦中有佛有衆生。"},{"id":"kenmitsu-00-0017","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"審思之。所謂密號名字相等義。眞言教中分明説之。故菩提場經云文殊白佛言。世尊以幾所名號於世界轉。佛言。所謂名帝釋名梵王。名大自在名自然名地。名寂靜名涅槃。名天名阿蘇羅名空。名勝名義名不實名三摩地。名悲者名慈。名水天名龍名藥叉名仙名三界主。名光名火名鬼主。名有名不有名分別名無分別。名蘇彌盧名金剛。名常名無常。名眞言名大眞言。名海名大海。名日名月名雲名大雲。名人主名大人主。名龍象名阿羅漢害煩惱。名非異名非不異。名命名非命名山名大山。名不滅名不生名眞如名眞如性。名實際名實際性。名法界名實名無二名有相。文殊師利。我於此世界成就五阿僧祇百千名號。調伏成就諸衆生。"},{"id":"kenmitsu-00-0018","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"如來無功用無量種眞言色力事相而轉龍樹釋大衍論云。言説有五種。名字有二種。心量有十種。契經異説故。論曰。言説有五。云何爲五。一者相言説。二者夢言説。三者妄執言説。四者無始言説。五者如義言説。楞伽契經中作如是説。大慧相言説者。所謂執著色等諸相而生。大慧夢言説者。念本受用虚妄境界依境界夢。覺已知依虚妄境界不實而生。大慧執著言説者。念本所聞所作業生。大慧無始言説者。從無始來執著戲論煩惱種子勳習而生。三昧契經中作如是説。舍利弗言。一切萬法皆悉言文。言文之相即非爲義。如實之義不可言説。今者如來云何説法佛言我説法者。以汝衆生在生説故説不可説。是故説之。"},{"id":"kenmitsu-00-0019","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"我所説者義語非文。衆生説者文語非義。語非義語者皆悉空無。空無之言無言於義。不言義者皆是妄語。如義語者。實空不空。空實不實。離於二相中間不中。不中之法離於三相。不見處所。如如如説故。如是五中前四言説虚妄説故不能談眞。後一言説如實説故得談眞理。馬鳴菩薩據前四故作如是説離言説相。心量有十。云何爲十。一者眼識心。二者耳識心。三鼻識心。四舌識心。五身識心。六意識心。七末那識心。八阿梨耶識心。九者多一識心十一一識心。如是十中初九種心不縁眞理。後一種心得縁眞理而爲境界。今據前九作如是説離心縁相喩曰。言語心量等離不離之義此論明説。顯教智者詳而解迷。金剛頂發菩提心論云。"},{"id":"kenmitsu-00-0020","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"上","text":"諸佛菩薩昔在因地發是心已。勝義行願三摩地爲戒。乃至成佛無時暫忘。惟眞言法中即身成佛故是説三摩地法。於諸教中闕而不書喩曰。此論者龍樹大聖所造千部論中密藏肝心論也。是故顯密二教差別淺深。及成佛遲速勝劣皆説此中。謂諸教者他受用身及變化身等所説諸顯教也。是説三摩地法者。自性法身所説祕密眞言三摩地門是也。所謂金剛頂十萬頌經等是也辨顯密二教論卷上"},{"id":"kenmitsu-01-0001","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"下","text":"六波羅蜜經云法寶自性恒清淨諸佛世尊如是説客塵煩惱之所覆如雲能翳日光明無垢法寶衆徳備常樂我淨悉圓滿法性清淨云何求無分別智而能證第一法寶即是摩訶般若解脱法身。第二法寶謂戒定智慧諸妙功徳。所謂三十七菩提分法。乃至以修此法而能證彼清淨法身。第三法寶者所謂過去無量諸佛所説正法及我今所説。所謂八萬四千諸妙法蘊。乃至調伏純熟有縁衆生。而令阿難陀等諸大弟子一聞於耳皆悉憶持。攝爲五分。一素呾纜。二毘奈耶。三阿毘達磨。四般若波羅蜜多。五陀羅尼門。此五種藏教化有情。隨所應度而爲説之。若彼有情樂處山林常居閑寂修靜慮者。而爲彼説素呾纜藏。若彼有情樂習威儀護持正法。"},{"id":"kenmitsu-01-0002","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"下","text":"一味和合令得久住。而爲彼説毘奈耶藏。若彼有情樂説正法分別性相。循環研覈究竟甚深。而爲彼説阿毘達磨藏。若彼有情樂習大乘眞實智慧離於我法執著分別。而爲彼説般若波羅蜜多藏。若彼有情不能受持契經調伏對法般若。或復有情造諸惡業四重八重五無間罪謗方等經一闡提等種種重罪使得銷滅。速疾解脱頓悟涅槃。而爲彼説諸陀羅尼藏。此五法藏譬如乳酪生蘇熟蘇及妙醍醐。契經如乳調伏如酪。對法教者如彼生蘇。大乘般若猶如熟蘇。總持門者譬如醍醐。醍醐之味乳酪蘇中微妙第一。能除諸病令諸有情身心安樂。總持門者契經等中最爲第一。能除重罪令諸衆生解脱生死速證涅槃安樂法身。復次慈氏我滅度後。"},{"id":"kenmitsu-01-0003","work":"辨顯密二教論","source":"T77n2427 辨顯密二教論（提供テキスト由来・原典未照合）","juan":"下","text":"令阿難陀受持所説素呾纜藏。其鄔波離受持所説毘奈耶藏。迦多衍那受持"},{"id":"sokushin-00-0001","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"卽身成佛義遍照金剛撰問曰。諸經論中皆説三劫成佛。今建卽身成佛義有何憑據答。祕密藏中如來如是説問。彼經説云何答。金剛頂經説。修此三昧者現證佛菩提此三昧者謂大日尊一字頂輪王三摩地也又云。若有衆生遇此教晝夜四時精進修。現世證得歡喜地。後十六生成正覺謂此教者。指法佛自内證三摩地大教王。歡喜地者。非顯教所説初地。是則自宗佛乘之初地。具説如地位品中。十六生者。指十六大菩薩生。具如地位品説也又云。若能依此勝義修。現世得成無上覺又云。應當知。自身卽爲金剛界。自身爲金剛。堅實無傾壞。我爲金剛身。大日經云。不捨於此身。逮得神境通。遊歩大空位。而成身祕密。又云。"},{"id":"sokushin-00-0002","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"欲於此生入悉地。隨其所應思念之。親於尊所受明法。觀察相應作成就云云此經所説悉地者。明持明悉地及法佛悉地。大空位者。法身同大虚而無礙。含衆象而常恒。故曰大空。諸法之所依住故號位。身祕密者。法佛三密等覺難見十地何窺。故名身祕密。又龍猛菩薩菩提心論説。眞言法中即身成佛故是説三摩地法。於諸教中闕而不書是説三摩地法者法身自證三摩地。諸教者他受用身所説諸顯教也又云。若人求佛慧。通達菩提心。父母所生身。速證大覺位。依如是等教理證文成立此義。如是經論字義差別云何。"},{"id":"sokushin-00-0003","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"頌曰六大無礙常瑜伽體四種曼荼各不離相三密加持速疾顯用重重帝網名即身無礙諸佛法然具足薩般若法佛成佛心數心王過刹塵無數各具五智無際智輪圓圓鏡力故實覺智所申此四句明成佛一字釋曰。此二頌八句以歎卽身成佛四字。卽是四字含無邊義。一切佛法不出此一句。故略樹兩頌顯無邊徳。頌文分二。初一頌歎卽身二字。次一頌歎成佛兩字。初中又四。初一句體二相三用四無礙。後頌中有四。初擧法佛成佛。次表無數。三顯輪圓。後出所由。謂六大者五大及識。大日經所謂。我覺本不生。出過語言道。諸過得解脱。遠離於因縁。知空等虚空。是其義也。"},{"id":"sokushin-00-0004","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"彼種子眞言曰buddh@abodhiavirah@u@mkha@mh@u@m。爲a阿字諸法本不生義者卽是地大。縛字離言説謂之水大。清淨無垢塵者是則囉字火大也。因業不可得者訶字門風大也。等虚空者欠字字相即空大也。我覺者識大。因位名識果位謂智。智即覺故。梵音沒馱冒地buddh@abodhi一字之轉沒馱名覺冒地曰智。故諸經中所謂三藐三冒地者。古翻云遍知新譯等覺。覺知義相渉故。此經號識爲覺者從强得名。因果之別本末異而已。經偈約五佛三摩地作如是説又金剛頂經云。諸法本不生。自性離言説。清淨無垢染。因業等虚空。此亦同大日經。諸法者謂諸心法。心王心數其數無量。"},{"id":"sokushin-00-0005","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"故曰諸心識名異義通。故天親等以三界唯心成立唯識義。自餘同上説。又大日經云。我卽同心位。一切處自在。普遍於種種。有情及非情阿字第一命。嚩字名爲水。囉字名爲火。𤙖字名爲風。佉字同虚空。此經文初句我卽同心位者。所謂心則識智也。後五句卽是五大。中三句者表六大自在用無礙徳。般若經及瓔珞經等亦説六大義。如是六大能造一切佛及一切衆生器界等四種法身三種世間。故大日尊説如來發生偈云能生隨類形諸法與法相諸佛與聲聞救世因縁覺勤勇菩薩衆及仁尊亦然衆生器世界次第而成立生住等諸法常恒如是生此偈顯現何義。謂表六大能生四種法身曼荼羅及三種世間。謂諸法者心法。法相者色法。復次諸法擧通名。"},{"id":"sokushin-00-0006","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"法相者顯差別。故下句云諸佛聲聞縁覺菩薩衆生器世間次第而成立。復次諸法者法曼荼羅。法相者三昧耶身。諸佛乃至衆生者大曼荼羅身。器世界者表所依土。此器界者三昧耶曼荼羅之總名也。復次佛菩薩二乘者表智正覺世間。衆生者衆生世間。器世界者卽是器世間也。復次能生者六大也。隨類形者所生法也。即四種法身三種世間是也。故次又言。祕密主有造曼荼羅聖尊分位種子標幟。汝當諦聽吾今演説。卽説偈曰眞言者圓壇先置於自體自足而至臍成大金剛輪從此而至心當思惟水輪水輪上火輪火輪上風輪謂金剛輪者阿字。阿字卽地。水火風如文而可知。圓壇者空。眞言者者心大也。長行中所謂聖尊者大身。種子者法身。"},{"id":"sokushin-00-0007","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"幖幟者三昧耶身。羯磨身者三身各各具之。具説者經文廣説之臨文可知。又曰。大日尊言。金剛手有諸如來意生作業喜戲行舞廣演品類。攝持四界安住心王等同虚空。成就廣大見非見果。出生一切聲聞辟支佛諸菩薩位。此文顯現何義。謂表六大能生一切。何以得知。謂心王者識大。攝持四界者四大。等虚空者空大。此六大能生。見非見者欲色界無色界。下如文。卽是所生法。如此經文皆以六大爲能生。以四法身三世間爲所生。此所生法上達法身下及六道。雖麁細有隔大小有差。然猶不出六大。故佛説六大爲法界體性。諸顯教中以四大等爲非情。密教則説此爲如來三摩耶身。四大等不離心大。心色雖異其性卽同。"},{"id":"sokushin-00-0008","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"色卽心心卽色無障無礙。智卽境境卽智。智卽理理卽智無礙自在。雖有能所二生都絶能所。法爾道理有何造作。能所等名皆是密號。執常途淺略義不可作種種戲論。如是六大法界體性所成之身。無障無礙互相渉入相應。常住不變同住實際。故頌曰六大無礙常瑜伽。解曰。無礙者渉入自在義。常者不動不壞等義。瑜伽者翻云相應。相應渉入卽是卽身成佛義四種曼荼各不離者。大日經説。一切如來有三種祕密身。謂字印形像。字者法曼荼羅。印謂種種幖幟卽三昧耶曼荼羅。形者相好具足身卽大曼荼羅。此三種身各具威儀事業。是名羯磨曼荼羅。是名四種曼荼羅。若依金剛頂經説。四種曼荼羅者。一大曼荼羅。謂一一佛菩薩相好身。"},{"id":"sokushin-00-0009","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"又綵畫其形像名大曼荼羅。又以五相成本尊瑜伽。又名大智印。二三昧耶曼荼羅。卽所持幖幟刀劍輪寶金剛蓮等類是也。若畫其像亦是也。又以二手和合金剛縛發生成印是。亦名三昧耶智印。三法曼荼羅。本尊種子眞言。若其種子字各書本位是。又法身三摩地及一切契經文義等皆是。亦名法智印。四羯磨曼荼羅卽諸佛菩薩等種種威儀事業等。若鑄若㘿等亦是。亦名羯磨智印。如是四種曼荼羅四種智印其數無量。一一量同虚空。彼不離此此不離彼。猶如空光無礙不逆。故云四種曼荼羅各不離。不離卽是卽義三密加持速疾顯者。謂三密者一身密二語密三心密。法佛三密甚深微細等覺十地不能見聞故曰密。一一尊等具刹塵三密。"},{"id":"sokushin-00-0010","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"互相加入彼此攝持。衆生三密亦復如是。故名三密加持。若有眞言行人觀察此義。手作印契口誦眞言心住三摩地。三密相應加持故早得大悉地。故經云。此毘盧遮那三字密言共一字無量。適以印密言印心成鏡智速獲菩提心金剛堅固體。印額應當知成平等性智速獲灌頂地福聚荘嚴身。以密語印喉時成妙觀察智即能轉法輪得佛智慧身。誦密言印頂成成所作智證佛變化身能伏難調者。由此印密言加持自身成法界體性智毘盧遮那佛虚空法界身。又云。入法身眞如觀一縁一相平等猶如虚空。若能專注無間修習。則入初地頓集一大阿僧祇劫福智資糧。由衆多如來所加持故。乃至十地等覺妙覺具薩般若。自他平等與一切如來法身共同。"},{"id":"sokushin-00-0011","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"常以無縁大悲利樂無邊有情作大佛事自此下儀軌之又云。若依毘盧遮那佛自受用身所説内證自覺聖智法。及大普賢金剛薩埵他受用身智。則於現生遇逢曼荼羅阿闍梨得入曼荼羅。爲具足羯磨以普賢三摩地引入金剛薩埵入其身中猶加持威徳力故。於須臾頃當證無量三昧耶無量陀羅尼門。以不思議法能變易弟子倶生我執種子。應時集得身中一大阿僧祇劫所集福徳智慧。則爲生在佛家。其人從一切如來心生。從佛口生從佛法生從法化生得佛法財。法財者謂三密菩提心教法此明初授菩提心戒時阿闍梨加持方便所得之益纔見曼荼羅能須臾頃淨信。以歡喜心瞻覩故。"},{"id":"sokushin-00-0012","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"則於阿頼耶識中種金剛界種子此文明初見曼荼羅海會諸尊所得益具受灌頂受職金剛名號。從此已後受得廣大甚深不思議法超越二乘十地。此大金剛薩埵五密瑜伽法門。於四時行住坐臥四威儀之中無間作意修習。於見聞覺知境界人法二空執悉皆平等。現生證得初地漸次昇進。由修五密於涅槃生死不染不著。於無邊五趣生死廣作利樂。分身百億遊諸趣中。成就有情令證金剛薩埵位此明依儀軌法則修行之時不思議法益又云。三密金剛以爲増上縁能證毘盧遮那三身果位。如是經等皆説此速疾力不思議神通三摩地法。若有人不闕法則晝夜精進。現身獲得五神通。漸次修練不捨此身進入佛位。具如經説。依此義故曰三密加持速疾顯。"},{"id":"sokushin-00-0013","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"加持者表如來大悲與衆生信心。佛日之影現衆生心水曰加。行者心水能感佛日名持。行者若能觀念此理趣。三密相應故現身速疾顯現證得本有三身。故名速疾顯。如常卽時卽日卽身義亦如是重重帝網名卽身者。是則擧譬喩以明諸尊刹塵三密圓融無礙。帝網者因陀羅珠網也。謂身者我身佛身衆生身是名身。又有四種身。言自性受用變化等流是名曰身。又有三種字印形是也。如是等身縱横重重。如鏡中影像燈光渉入。彼身卽是此身。此身卽是彼身。佛身卽是衆生身。衆生身卽是佛身。不同而同不異而異。故三等無礙眞言曰歸命句如常asametrisamesamayesv@ah@a阿三迷底哩三迷三昧曳莎呵初句義云無等。"},{"id":"sokushin-00-0014","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"次云三等。後句云三平等。佛法僧是三。身語意亦三。心佛及衆生三也。如是三法平等平等一也。一而無量無量而一。終不雜亂。故曰重重帝網名卽身法然具足薩般若者。大日經云。我一切本初。號名世所依。説法無等比。本寂無有上。謂我者大日尊自稱。一切者擧無數。本初者本來法然證得如是大自在一切法之本祖。如來法身衆生本性。同得此本來寂靜之理。然衆生不覺不知。故佛説此理趣覺悟衆生。又云。諸樂欲因果者。非彼愚夫能知眞言之相何以故。説因非作者。彼果則不生。此因尙空云何而有果。當知眞言果。悉離於因果。上文所引我覺本不生乃至遠離於因縁偈。及諸法本不生乃至因業等虚空。"},{"id":"sokushin-00-0015","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"如是等偈皆明法然具足之義。又金剛頂云。自性所成眷屬金剛手等十六大菩薩。乃至各各流出五億倶胝微細法身金剛如是等文亦是此義也。言法然者顯諸法自然如是。具足者成就義無闕少義。薩般若者梵語也。古云薩云者訛略。具云薩羅婆枳孃曩。翻云一切智智。一切智智者。智者決斷簡擇義。一切佛各具五智三十七智乃至刹塵智。次兩句卽表此義。若明決斷徳則以智得名。顯集起則以心得稱。顯軌持則法門得稱。一一名號皆不離人。如此人數過刹塵。故名一切智智。不同顯家一智以對一切得此號。心王者法界體性智等。心數者多一識。各具五智明一一心王心數各各有之。無際智高廣無數之義。圓鏡力故實覺智者。此卽出所由。"},{"id":"sokushin-00-0016","work":"即身成佛義","source":"T77n2428 即身成佛義（提供テキスト由来・原典未照合）","juan":"一卷","text":"一切諸佛因何得覺智名。謂如一切色像悉現高臺明鏡之中。如來心鏡亦復如是。圓明心鏡高懸法界頂。寂照一切不倒不謬。如是圓鏡何佛不有。故曰圓鏡力故實覺智卽身成佛義"},{"id":"sokushin_qa-01-0001","work":"眞言宗卽身成佛義問答","source":"提供テキスト『眞言宗卽身成佛義問答』（出典・版本未確認）","juan":"一卷","text":"眞言宗卽身成佛義問答一卷問。諸經論中皆説超三大劫成佛。今眞言宗立卽身成佛之義有明證文耶答。眞言經論中多有證文問。其經論者何等耶答。金剛頂等經及菩提心論也問。其經論文何耶答。經云。修此三昧者現證佛菩提。菩提心論云。若人求佛惠。通達菩提心。父母所生身。速證大覺位問。此卽身成佛之教爲大小之機共被耶。爲當有簡別耶答。此有傍正二意問。其二意如何答。正爲大機傍被小機問。何以得知正爲大機傍被小機耶答。大日經云。佛子此大乘。眞言行道法。我今正開演。爲被大乘器。又云。復次祕密主於當來世時。劣惠諸衆生以癡愛自蔽。盲冥樂求果不知解此道。爲度彼等故隨順説是法。"},{"id":"sokushin_qa-01-0002","work":"眞言宗卽身成佛義問答","source":"提供テキスト『眞言宗卽身成佛義問答』（出典・版本未確認）","juan":"一卷","text":"故知正爲大機傍被小機也問。於佛有能生之物耶答。有之問。何者此能生耶答。今意以六大爲能生之物問。其六大者何答。一地大二水大三火大四風大五空大六識大也問。何故此六種當謂大耶答。其體性無有邊際常住不變故名爲大問。以此六大爲能生若有證文答。大日經云。眞言者圓壇。先置於自體自足而至臍。成大金剛輪。從此而至心。當思惟水輪。水輪上火輪。火輪上風輪問。水火風三大有證文。今地空識三大未顯。意何答。金剛輪卽地大。圓壇卽空大。眞言者卽識大也問。此是六大之證文也。能生之證文何答。經云。能生隨類形。諸法與法相。諸佛與聲聞救世因縁覺。勤勇菩薩衆。及仁尊亦然。衆生器世界。"},{"id":"sokushin_qa-01-0003","work":"眞言宗卽身成佛義問答","source":"提供テキスト『眞言宗卽身成佛義問答』（出典・版本未確認）","juan":"一卷","text":"次第而成立云云此六大能生諸法及三種世間。是證文也問。大機小機共修此教者一共卽身成佛耶答。此不可爾問。其意何答。今意可云大機卽身成佛小機者後十六生成佛問。何以得知大機卽身成佛小機經十六生成佛答。經云。修此三昧者現證佛菩提。此卽大機卽身成佛之證文。若有衆生遇此教晝夜四時精進修。現世證得歡喜地。後十六生成正覺。此卽小機成佛之證文也問。不簡大小機令卽身成佛者勝可見。旣有速遲何殊餘宗耶答。法相等宗經三大劫都無成佛之理。今此宗意者小機只經十六生成佛。尙勝餘宗問。何故不云十八生十七生。定云經十六生耶答。經十六大菩薩生故云爾問。六大生佛之時自然而生耶。爲當有生方耶答。"},{"id":"sokushin_qa-01-0004","work":"眞言宗卽身成佛義問答","source":"提供テキスト『眞言宗卽身成佛義問答』（出典・版本未確認）","juan":"一卷","text":"可云有生方問。其生方何答。觀五大種子安立自體上。結契印誦眞言時。不思議加持起而生佛問。其不思議加持者誰加持耶答。此法佛加持也問。若爾行者之觀念修行力故。感諸佛加持而成佛。何今云六大生佛耶答。六大卽諸佛故六大爲體性所依而觀念修行時。不思議加持發而生佛。所以無咎問其加持者意何答。佛日大悲之影現行者信心之水曰加。行者信心水能感佛日名持問。小機經十六生。大機者不經耶答。可云大機亦經十六生也問。若爾何云卽身成佛耶答。大小機雖云經十六生。横竪義故速遲各殊"},{"id":"shojiitsu-00-0001","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"聲字實相義一叙意二釋名體義三問答初叙意者。夫如來説法必藉文字。文字所在六塵其體。六塵之本法佛三密即是也。平等三密遍法界而常恒。五智四身具十界而無缺悟者號大覺。迷者名衆生。衆生癡暗無由自覺。如來加持示其歸趣。歸趣之本非名教不立。名教之興非聲字不成。聲字分明而實相顯所謂聲字實相者。即是法佛平等之三密衆生本有之曼荼也故。大日如來説此聲字實相之義。驚彼衆生長眠之耳。若顯若密。或内或外。所有教法誰不由此門戸。今憑大師之提撕抽出此義。後之學者尤研心遊意而已。叙大意竟次釋名體義此亦分二。一釋名。二出體義初釋名者。内外風氣纔發必響名曰聲也。響必由聲。聲則響之本也。"},{"id":"shojiitsu-00-0002","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"聲發不虚。必表物名號曰字也。名必招體。名之實相。聲字實相三種區別名義。又四大相觸音響必應名曰聲也。五音･八音･七例･八轉。皆悉待聲起。聲之詮名必由文字。文字之起本之六塵。六塵文字如下釋若約六離合釋。由聲有字。字則聲之字。依主得名。若謂實相由聲字顯。則聲字之實相。亦依主得名。若謂聲必有字。聲則能有。字則所有。能有字財則有財得名。聲字必有實相。實相必有聲字。互相能所則得名如上。若言聲外無字。字則聲持業釋。若言聲字外無實相。聲字則實相亦如上名。此義大日經疏中具説。臨文可知。若噵聲字實相極相迫近不得避遠。並隣近得名。若噵聲字假而不及理。實相幽寂而絶名。"},{"id":"shojiitsu-00-0003","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"聲字與實相異。聲空響而無詮。字上下長短而爲文。聲將字異。並相違立名。帶數闕無。如上五種名中。相違約淺略釋。持業･隣近據深祕釋。餘二通二釋二釋體義又二。初引證。後釋之。初引證者。問曰。今依何經成立此義。答。據大日經有明鑒。彼經何説。其經法身如來説偈頌曰等正覺眞言言名成立相如因陀羅宗諸義利成就有増加法句本名行相應問。此頌顯何義答。此有顯密二意。顯句義者。如疏家釋。密義中又有重重横竪深意。故頌中引喩説如因陀羅宗諸義利成就。因陀羅者亦具顯密義顯義云。帝釋異名。諸義利成就者。天帝自造聲論。能於一言具含衆義。故引以爲證。世間智慧猶尚如此。何況如來於法自在耶。"},{"id":"shojiitsu-00-0004","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"若作祕密釋者。一一言･一一名･一一成立。各能具無邊義理。諸佛菩薩起無量身雲。三世常説一一字義猶尚不能盡･何況凡夫乎。今且示一隅耳。頌初等正覺者。平等法佛之身密是也。此是身密其數無量。如即身義中釋。此身密則實相也。次眞言者。則是聲。聲則語密。次言名者。即是字也。因言名顯。名即字故。是則一偈中聲字實相而已。若約一部中顯斯義。且就大日經釋。此經中所説諸尊眞言即是聲也。阿字門等諸字門及字輪品等即是字。無相品及説諸尊相文並是實相。復次約一字中釋此義者。且梵本初阿字開口呼時。有阿聲即是聲。阿聲呼何名。表法身名字。即是聲字也。法身有何義。所謂法身者。諸法本不生義。"},{"id":"shojiitsu-00-0005","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"即是實相。已聞經證。請釋其體義。頌曰五大皆有響十界具言語六塵悉文字法身是實相釋曰。頌文分四。初一句竭聲體。次頌極眞妄文字。三盡内外文字。四窮實相。初謂五大者。一地大。二水大。三火大。四風大。五空大。此五大具顯密二義。顯五大者如常釋。密五大者五字五佛及海會諸尊是。五大義者如即身義中釋。此内外五大悉具聲響。一切音聲不離五大。五大即是聲之本體。音響則用。故曰五大皆有響。次十界具言語者。謂十界者。一一切佛界。二一切菩薩界。三一切縁覺界。四一切聲聞界。五一切天界。六一切人界。七一切阿修羅界。八一切傍生界。九一切餓鬼界。十一切捺落迦界。"},{"id":"shojiitsu-00-0006","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"自外種種界等攝天鬼及傍生趣中盡。華嚴及金剛頂理趣釋經有十界文。此十界所有言語皆由聲起。聲有長短高下音韻屈曲。此名文。文由名字。名字待文。故諸訓釋者云文即字者。蓋取其不離相待耳。此則内聲文字也。此文字且有十別。上文十界差別是。此十種文字眞妄云何。若約竪淺深釋則九界妄也。佛界文字眞實。故經云眞語者･實語者･如語者･不誑語者･不異語者。此五種言梵云曼荼羅。此一言中具五種差別故。龍樹名祕密語。此祕密語則名眞言也。譯者取五中一種翻耳。此眞言詮何物。能呼諸法實相不謬不妄。故名眞言。其眞言云何呼諸法名。雖云眞言無量差別。極彼根源不出大日尊海印三昧王眞言。彼眞言王云何。"},{"id":"shojiitsu-00-0007","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"金剛頂及大日經所説字輪字母等是也。彼字母者。梵書阿字等乃至呵字等是。此阿字等則法身如來一一名字密號也。乃至天龍鬼等亦具此名。名之根本法身爲根源。從彼流出稍轉爲世流布言而已。若知實義則名眞言。不知根源名妄語。妄語則長夜受苦。眞言則拔苦與樂。譬如藥毒迷悟損益不同問曰。龍猛所説五種言説ト今所説二種言説。如何相攝答。相夢妄無始者屬妄攝。如義則屬眞實攝。已説眞妄文字竟次釋内外文字相頌文六塵悉文字者。謂六塵者。一色塵。二聲塵。三香塵。四味塵。五觸塵。六法塵。此六塵各有文字相。初色塵字義差別云何。頌曰顯形表等色内外依正具法然隨縁有能迷亦能悟釋曰。頌文分四。"},{"id":"shojiitsu-00-0008","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"初一句擧色差別。次句表内外色互爲依正。三顯法爾隨縁二種所生。四説此種種色於愚者爲毒於智者爲藥初句顯形表等色者。此有三別。一顯色。二形色。三表色。一顯色者五大色是。法相家説四種色不立黒色。依大日經立五大色五大色者。一黄色。二白色。三赤色四黒色。五青色。是五大色名爲顯色。是五色即是五大色。如次配知。影光明闇雲煙塵霧及空一顯色亦名顯色。又若顯了眼識所行名顯色。此色具好惡倶異等差別。大日經云心非青黄赤白紅紫水精色非明非闇。此遮心非顯色。次形色者。謂長短麁細正不正高下是。又方圓三角半月等是也。又若色積集長短等分別相是也。大日經疏云心非長非短非圓非方者。"},{"id":"shojiitsu-00-0009","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"此遮心非形色。三表色者。謂取捨屈申行住坐臥是。又即此積集色生滅相續由變異因。於先生處不復重生轉於異處。或無間或有間。或近或遠差別生。或即於此處變異生是。又業用爲作轉動差別是名表色。大日經云心非男非女者。亦遮心非表色。是亦通顯形色。又云云何自知心。謂或顯色或形色。若色受想行識。若我若我所。若能執若所執中求不可得者。此明顯形表色之名。顯形如文可知。自下即是表色也。取捨業用爲作等故。如是一切顯形表色是眼所行。眼境界。眼識所行眼識境界眼識所縁。意識所行意識境界意識所縁。名之差別。如是差別即是文字也。各各相則是文故。各各文則有各各名字。故名文字。此是三種色文字。"},{"id":"shojiitsu-00-0010","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"或分二十種差別。前所謂十界依正色差別故。瑜伽論云。今當先説色聚諸法問一切諸法生皆從自種而起。云何説諸大種能生所造色耶。云何造色依彼。彼所建立。彼所任持。彼所長養耶答。由一切内外大種及所造色種子皆悉依附内相續心。乃至諸大種子未生諸大以來。造色種子終不能生造色。要由彼生造色方從自種子生。是故説彼能生造色。由彼生爲前導故。由此道理説諸大種爲彼生因。云何造色依於彼耶。由造色生已不離大種處而轉故。云何彼所建立。由大種損益彼同安危故。云何彼所任持。由隨大種等量不壞故。云何彼所長養。由因飮食睡眠修習梵行三摩地等。依彼造色倍復増廣故。説大種爲彼長養因。"},{"id":"shojiitsu-00-0011","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"如是諸大種望所造色有五種作用應知。復次於色聚中曾無極微生。若從自種生時唯聚集生。或細或中或大。又非極微集成色聚。但由覺慧分析諸色。極量邊際分別。假立以爲極微。又色聚亦有方分極微亦有方分。然色聚有分非極微。何以故。由極微即是分。此是聚色所有。非極微復有餘極微。是故極微非有分相。又不相離有二種。一同處不相離。謂大種極微與色香味觸等。於無根處有離根者。於有根處有有根者。是名同處不相離。二和雜不相離。謂即此大種極微與餘聚集能造所造色處倶故。是名和雜不相離。又此遍滿聚色應知。如種種物石磨爲末以水和合互不相離。非如胡麻緑豆粟稗等聚。"},{"id":"shojiitsu-00-0012","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"又一切所造色皆即依止大種處不過大種處量。乃至大種所據處所諸所造色還即據此。由此因縁説所造色依於大種。即以此義説諸大種名爲大種。由此大種其性大故。爲種生故。又於諸色聚中略有十四種事。謂地水火風色聲香味觸及眼等五根。唯除意所行色云云又立十種色。具如彼説。如是種種色差別即是文字也。又以五色書阿字等亦名色文字。又彩畫種種有情非情亦名色文字。錦繍綾羅等亦是色文字也。法華華嚴智度等亦具説種種色差別。然不出内外十界等。如是色等差別是名色文字。此是文字於愚能著能愛。發貪瞋癡等種種煩惱。具造十惡五逆等故。頌曰能迷。於智則能觀因縁。不取不捨。能建立種種法界曼荼羅。"},{"id":"shojiitsu-00-0013","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"作廣大佛事業。上供諸佛。下利衆生。自利利他因茲圓滿。故曰能悟。次内外依正具者。此亦有三。一明内色具顯形等三。二明外色亦具三色。三明内色非定内色。外色非定外色。互爲依正。言内色者有情。外色者器界。經云。佛身不思議。國土悉在中。又一毛示現多刹海。一一毛現悉亦然。如是普周於法界。又一毛孔内難思刹。等微塵數種種住。一一皆有遍照尊。在衆會中宣妙法於一塵中。大小刹種種差別如塵數。一切國土所有塵一一塵中佛皆入。今依此等文明知。佛身及衆生身大小重重。或以虚空法界爲身量。或以不可説不可説佛刹爲身量。乃至以十佛刹一佛刹一微塵爲身量。如是大小身土互爲内外。互爲依正。"},{"id":"shojiitsu-00-0014","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"此内外依正中必具顯形表色。故曰内外依正具。法然隨縁有者。如上。顯形等色。或法然所成。謂法佛依正是。大日經曰。爾時大日世尊入於等至三昧。即時諸佛國土地平如掌。五寶間錯。八功徳水芬馥盈滿。無量衆鳥。鴛鴦鵝鵠出和雅音。時華雜樹敷榮間列。無量樂器自然諧韻。其聲微妙人所樂聞。無量菩薩隨福所感宮室殿堂意生之座。如來信解願力所生。法界幖幟大蓮華王出現。如來法界性身安住其中。此文現顯何義。謂有二義。一明法佛法爾身土。謂法界性身法界幖幟故。二明隨縁顯現。謂菩薩隨福所感及如來信解願力所生故。謂大日尊者。梵云摩訶毘盧遮那佛陀。大毘盧遮那佛者。是乃法身如來也。"},{"id":"shojiitsu-00-0015","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"法身依正則法爾所成。故曰法然有。若謂報佛亦名大日尊。故曰信解願力所生。又云時彼如來一切支分無障閡力。從十智力信解所生無量形色莊嚴之相。此文明報佛身土。若謂應化佛或名大日尊應化光明普照法界。故得此名。故經云或名釋迦或名毘盧遮那。大日經云無數百千倶胝那由他劫。六度等功徳所資長身。此明應化佛行願身土。若謂等流身亦名大日尊。分有此義故。經云即時出現者。此文明等流身暫現速隱。身既有。土豈無乎。此明等流身身及土。上所説依正土並通四種身。若約竪義有大小麁細。若據横義平等平等一。如是身及土並有法爾隨縁二義。故曰法然隨縁有。如是諸色皆悉具三種色互爲依正此且約佛邊釋。"},{"id":"shojiitsu-00-0016","work":"聲字實相義","source":"T77n2429 聲字實相義（提供テキスト由来・原典未照合）","juan":"一卷","text":"若約衆生邊釋亦復如是。若謂衆生亦有本覺法身。與佛平等。此身此土法然有而已。三界六道身及與土隨業縁有。是名衆生隨縁。又經云。染彼衆生界以法界味。味則色義。如加沙味。此亦明法然色。如是内外諸色。於愚爲毒。於智爲藥。故曰能迷亦能悟。如是法爾隨縁種種色等。能造所造云何。能生則五大五色。所生則三種世間。此是三種世間有無邊差別。是名法然隨縁文字。已釋色塵文竟聲字實相義"},{"id":"un-00-0001","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"吽字義遍照金剛撰一吽字相義分二。一解字相。二釋字義。初解字相者又分四。四字分離故金剛頂釋此一字具四字義。一賀字義。二阿字義。三汚字義。四麼字義。一賀字義者。中央本尊體是其字也。所謂賀字是因義也。梵云係怛嚩二合即是因縁義。因有六種。及因縁義中因有五種。如阿毘曇廣説。若見訶字門即知一切諸法無不從因縁生。是爲訶字字相。二阿字義者。訶字中有阿聲。即是一切字之母一切聲之體一切實相之源。凡最初開口之音皆有阿聲。若離阿聲則無一切言説。故爲衆聲之母。若見阿字則知諸法空無。是爲阿字字相。三汚字是一切諸法損減義。若見汚字則知一切法無常苦空無我等。是則損減即是字相也。"},{"id":"un-00-0002","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"四麼字義者。梵云怛麼此翻爲我我有二種。一人我二法我。若見麼字門則知一切諸法有我人衆生等。是名増益。是則字相。一切世間但知如是字相。未曾解字義。是故爲生死人。如來如實知實義。所以號大覺二解字義有四。訶阿汚麼四字差別故初訶字實義者。所謂訶字門一切諸法因不可得故。何以故。以諸法展轉待因成故。當知最後無依。故説無住爲諸法本。所以然者以種種門觀諸法因縁悉不生故。當知萬法唯心。心之實相即是一切種智。即是諸法法界。法界即是諸法之體不得爲因。以是言之因亦是法界。縁亦是法界。因縁所生法亦是法界。阿字門從本歸末畢竟到如是處。今亦訶字門亦從末歸本畢竟到如是處。"},{"id":"un-00-0003","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"阿字從本不生生一切法。今亦訶字以無因待爲諸法因。終始同歸。則中間旨趣皆可知矣。是名訶字實義次阿字實義者有三義。謂不生義空義有義。如梵本阿字有本初聲。若有本初則是因縁之法。故名爲有。又阿者無生義。若法攬因縁成則自無有性。是故爲空。又不生義者即是一實境界即是中道。故龍猛云。因縁生法亦空亦假亦中。又大論明薩婆若有三種名。一切智與二乘共。道種智與菩薩共。一切種智是佛不共法。此三智其實一心中得。爲分別令人易解故作三種名。即是阿字義。又所謂阿字門一切諸法本不生者。凡三界語言皆依於名。而名依於字。故悉曇阿字亦爲衆字之母。當知阿字門眞實義亦復如是。遍於一切法義之中也。"},{"id":"un-00-0004","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"所以者何。以一切法無不從衆縁生。從縁生者悉皆有始有本。今觀此能生之縁。亦復從衆因縁生。展轉從縁誰爲其本。如是觀察時則知本不生際。是萬法之本。猶如聞一切語言時即是聞阿聲。如是見一切法生時即是見本不生際。若見本不生際者是如實知自心。如實知自心即是一切。智智。故毘盧遮那唯以此一字爲眞言也。而世間凡夫不觀諸法本源故妄見有生。所以隨生死流不能自出如彼無智畫師自運衆綵作可畏夜叉之形。成已還自觀之心生怖畏頓躄于地。衆生亦復如是。自運諸法本源畫作三界。而還自沒其中。自心熾然備受諸苦。如來有智畫師既了知已。即能自在成立大悲漫荼羅。由是而言。所謂甚深祕藏者衆生自祕之耳。"},{"id":"un-00-0005","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"非佛有隱也。是則阿字之實義也。又經云。阿字者是菩提心義。是諸法門義。亦無二義。亦諸法果義。亦是諸法性義是自在義。又法身義。如是等義皆是阿字實義也。又守護國界主陀羅尼經説。爾時一切法自在王菩薩摩訶薩白佛言三汚字實義者。所謂汚字門一切諸法損減不可得故。是名字義。復次一心法界猶如一虚常住。塵數智慧譬如三辰本有。雖云高山干漢曾臺切天。而不損減者大虚之徳也雖云劫水漂地猛火燒臺。而不増益者大虚之徳也。一心虚空亦復如是。雖云無明住地無邊際。我慢須彌無頭頂。而一心虚空本來常住不損不減。是則汚字實義也。雖六師外道撥無因果。三密虚空本來湛然無損無減。是名汚字實義。"},{"id":"un-00-0006","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"諸二乘等擧無我之利斧斫身心之柴薪。然猶一心本法寧有損減。故名汚字不損減。又大乘空觀之猛火燒人法執著之塵垢無有遺餘。三密不損猶如火布垢盡衣淨。汚字實義亦復如是復次或破遍計之蜃樓壞依他之幻城。三密本法豈有毀傷乎。汚字實義應如是知。又有人厭有爲之非眞欣無爲之離妄。絶言語道於癈詮之門。滅心行處於寂滅之津。於此三密本法何曾絶減。汚字實義應當知之。所謂損減者苦空無常無我故。四相遷變故。不得自在故。不住自性故。因縁所生故。相觀待故。以是六義故名諸法損減。今所謂汚字實義者不如是也。經云。汚字報身義。此報者非因縁酬答之報果。相應相對故名曰報也。此則理智相應故曰報。"},{"id":"un-00-0007","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"心境相對故曰報也。法身智身相應無二故名報。性相無礙渉入故曰報。體用無二相應故曰報也。是故常樂我淨汚字實義無損減故。一如不動汚字實義無異相遷變故。十自在是汚字實義無罣礙故。本住體性汚字實義不改轉故。遠離因縁汚字實義本來不生等虚空故。超過觀待汚字實義同一性故。復次因縁生法必帶四相。帶四相故變壞無常。變壞無常故苦空無我。苦空無我故不得自在。不得自在故不住自性。不住自性故高下相望尊卑重重。若以劣望勝劣則爲損。以下比上下則名減。如是損減其數無量。誠是背本向末違源順流之所致也。是故三界六道。長迷一如之理。常醉三毒之事。荒獵幻野無心歸宅。長眠夢落覺悟何時。"},{"id":"un-00-0008","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"今以佛眼觀之。佛與衆生同住解脱之床。無此無彼無二平等。不増不減周圓周圓。既無勝劣増益之法。何有上下損減之人。果名汚字實義復次約旋陀羅尼門釋者。一切諸法本不生故汚字門無損減。諸法離作業故汚字門亦無損減。諸法等虚空無相故汚字門亦復等虚空無損減。諸法無行故汚字門亦復無行。諸法無一合相故汚字門亦復無一合相。諸法離遷變故汚字門亦離遷變。諸法無影像故汚字門亦無影像諸法無生故汚字門亦復無生。諸法無戰敵故汚字門亦無戰敵諸法無慢故汚字門亦無憍慢。諸法無長養故汚字門亦無長養。諸法無怨對故汚字門亦無怨對。諸法無執著故汚字門亦無執著。諸法如如不可得故汚字門如如不可得。"},{"id":"un-00-0009","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"諸法住處不可得故汚字門亦無住處。諸法施不可得故汚字門亦無捨施。諸法法界不可得故汚字門亦無法界。諸法第一義不可得故汚字門亦無勝義。諸法不堅如聚沫故汚字門亦無聚沫。諸法縛不可得故汚字門亦無縛脱。諸法有不可得故汚字門亦復無有。諸法乘不可得故汚字門亦復無乘。諸法塵垢不可得故汚字門亦無塵垢。諸法相不可得故汚字門亦復無相。諸法離言説故汚字門亦無言説。諸法本寂故汚字門本來寂靜。諸法性鈍故汚字門亦復性鈍。諸法諦不可得故汚字門諦不可得。諸法因不可得故汚字門因不可得。因不可得則本初不生。本初不生則不増不減。不増不減則大般涅槃果海。大般涅槃果海則如來法身。"},{"id":"un-00-0010","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"是名汚字實義三界業報六道苦身即生即滅念念不住無體無實如幻如影分段變易因縁生法九百生滅如焔如流藏海常住七波推轉爾許無常能毀能損於此本有何勞何憂汚字實義應如是知日月星辰本住處空雲霧蔽虧烟塵映覆愚者視之謂無日月本有三身亦復如是無始以來本住心空覆以妄想纒以煩惱事均篋境理同礦珠妄者視之謂無本覺愚盲撥無非損而何於彼本身損減不得汚字實義應如是知決定二乘妄生滅想燒滅身智同彼大虚沈醉昧酒不覺不醒決定不定輕重有差空歴劫數損無過此本有三身儼然不動遍空諸佛驚覺開示乃起化城迴趣寶所草木也成何況有情妄執不了爲損是多汚字實義當如是知正因所生報果色身萬徳莊嚴四智圓滿但有相續非是凝然生者"},{"id":"un-00-0011","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"必滅一向記故此是權劍能殺能害本有三密如日麗天如空四智似金埋地猛風之因利钁之縁誰能生之誰能造之汚字實義當如是知眞如法性心之實常凡有心者誰無此理心智即理非心外理心理是一濕鑒豈別如性等遍心行狡劣權誘嬰兒迷者不知揮此權戟破彼眞佛是名損減常遍本佛不損不虧汚字實義汝等應知水外無波心内即境草木無佛波則無濕彼有此無非權而誰遮有立無是損是減損減利斧常斫佛性雖然本佛無損無減三諦圓渉十世無礙三種世間皆是佛體四種是荼即是眞佛汚字實義應知是學二乘智劣爲説六識大乘稍勝乃示八九執滯不進奚知無數不解密意得小爲足不識已有貧莫過此塵刹海會即是我寶汚字實義當如是學同一多如多故如如理理無數智智"},{"id":"un-00-0012","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"無邊恒沙非喩刹塵猶小雨足雖多並是一水燈光非一冥然同體色心無量實相無邊心王心數主伴無盡互相渉入帝珠錠光重重難思各具五智多而不異不異而多故名一如一非一一無門爲一如非如常同同相似不説此理即是隨轉無盡寶藏因之秏竭無量寶車於此消盡謂之損減地墨四身山毫三密本自圓滿凝然不變汚字實義斯之謂歟第四摩字實義者。所謂摩字門一切諸法吾我不可得故。是名實義。所謂我有二種。一人我。二法我。人謂四種法身。法謂一切諸法。從一法界一眞如一菩提。乃至八萬四千不可説不可説微塵數法是。如是四種法身雖其數無量。而體則一相一味無此無彼。既無彼此寧有吾我。是則遮情實義。此處則金剛已還四種行人等。"},{"id":"un-00-0013","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"希兮夷今如聾如盲。絶之又絶遠之又遠。四句不及六通亦極。是名絶言之實義。經云。麼字者大日之種子。一切世間雖計我我而未證實義。唯有大日如來於無我中得大我也。心王如來既至如是地。塵數難思心所眷屬誰不得此大我之身。是則表徳之實義。經云。是麼字化身義者。所謂化者化用化作義遮那如來自受用故化作種種神變現無量身雲興無邊妙土義是名妙用難思之實義。又云。此麼字者三昧耶自在義無所不遍義者。言三昧耶者唐言等持。等者平等持者攝持。法身三密入纎芥而不迮。亙大虚而不寛。不簡瓦石草木不擇人天鬼畜。何處不遍何物不攝。故名等持。是名平等之實義。又云。麼字轉聲名瞞。即是妙徳之一字眞言。"},{"id":"un-00-0014","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"是圓滿具足之義。言文殊童身者四徳中之我波羅蜜。無智而不妙無徳而不圓。二美具足四辯澄湛。即是圓徳之實義。又云。麼字第十一轉名𤚥。此是不動尊之心也。此尊者三世十方一切諸佛之祖師。四十二地一切菩薩之所尊。雖然現使者之眇相示奴僕之垂髮。屈已成之尊位飡初心之遺穢。是則高而不奢損而招盈。即是損己益物之實義。若入麼字之吾我門。攝之諸法無一一法而不該。故經云。我則法界。我則法身。我則大日如來。我則金剛薩埵。我則一切佛。我則一切菩薩。我則縁覺。我則聲聞。我則大自在天。我則梵天。我則帝釋。乃至我則天龍鬼神八部衆等。一切有情非情無不麼字。是則一而能多小而含大。"},{"id":"un-00-0015","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"故名圓融之實義次合釋者。此吽以四字成一字。所謂四字者阿訶汚麼。阿法身義。訶報身義。汚應身義。麼化身義。擧此四種攝彼諸法無不括。且以別相言。以阿字門攝一切眞如法界法性實際等理無所不攝。以訶字門攝一切内外大小權實顯密等教無所不攝。以汚字門攝一切行三乘五乘等行無所不攝。以麼字門攝一切果法無所不攝。理理盡持事事悉攝。故名總持。若以通相釋。各各攝理教行果等。無所不攝無所不盡。猶如因陀羅宗一切義利悉皆成就。又如伏羲六爻一一爻中各具萬像。復次此吽字中有訶字是因。因縁所生法。於此法中諸外道二乘及大乘教等教網紛紜。各擧旗鼓爭稱僞帝。若外道若二乘若大乘。"},{"id":"un-00-0016","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"執有人有法有因有果有常有我。是等皆是麼字點中攝。即是増益邊未得中道。若執無人無法無因無果無常無我等。即是汚字點中攝。即是損減邊。亦未會中道。若執非空非有非常非斷非一非異等。阿字中非義中攝。若執不生不滅不増不減等八不等。又阿字中不義中攝。又若執無色無形無言無説等。亦阿字中無義中攝。亦未會眞實義。並是遮情之邊。若未解諸法密號名字相眞實語如義語者。所有言説思惟修行等悉是顚倒悉是戲論。不知眞實究竟理故。故龍猛菩薩云。佛法中有二諦。一者世諦。二者第一義諦。爲世諦故説有衆生。爲第一義諦故説衆生無所有。復有二種。爲不知名字相密號者。説第一義中無衆生。爲知名字相密號者。"},{"id":"un-00-0017","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"説第一義中有衆生。若有人能知此吽字等密號密義。則名正遍知者。所謂初發心時便成正覺轉大法輪等。良由知此究竟實義也復次約此一字明三乘人因行果者。先明聲聞人。次約縁覺。後明菩薩。初明聲聞者。此吽字中有訶字。即是因義。伽等云聲聞乘種性者是其因也。下有汚字。是其行也。聲聞人四諦法五停心觀七方便等此是行也。是汚字字相此其當也。今聲聞人灰身滅智以爲究竟果。此吽字上有空點。是空點者麼字所生。麼字兼人法二空義。其人空理即聲聞所證之理。是名聲聞人因行果。次明縁覺者。伽等所謂縁覺乘種性等是其因也。此吽字中有訶字是其因也。縁覺亦觀十二因縁四諦方便等。此吽字下有汚字是其當也。"},{"id":"un-00-0018","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"縁覺亦證人空理此其果也。准上知之。次明菩薩者。遮那經金剛頂經等説菩薩人菩提心爲因大悲爲根方便爲究竟。今此吽字本體訶字。是則一切如來菩提心以爲因也。下有三昧畫。是大悲萬行義。上有大空點。是究竟大菩提涅槃之果也。以此一字攝三乘人因行果等悉攝無餘。及以顯教一乘祕密一乘之因行等准知之次明以此一字通攝諸經論等所明理者。且大日經及金剛頂經所明。皆不過此菩提爲因大悲爲根方便爲究竟之三句若攝廣就略攝末歸本。則一切教義不過此三句。束此三句以爲一吽字。廣而不亂略而不漏。此則如來不思議力法然加持之所爲也。雖千經萬論。亦不出此三句一字。其一字中所開因行果等准前思之。"},{"id":"un-00-0019","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"非只吽字攝如是義。所餘一一字門亦復如是。復次擁護義者。謂上有大空點是佉字門。即是大空義。即是般若佛母明妃義。中有訶字是因義。於此虚空藏中含養眞因種子。即是大護義也復次自在能破義者。謂上有空點即是佉字門。佉字門猶如虚空畢竟清淨無所有。即是高峯觀所知境界。中有訶字是菩提幢。亦是自在力。以此二字相應故。猶如大將能破怨敵。故名自在能破義復次能滿願義者。謂訶字門是菩提心寶。與佉字門虚空藏和合故。得成巧色摩尼。能滿一切衆生希願。是曰能滿願義復次大力義者。謂訶字菩提心中具足一切如來十力等。今與佉字合故。離諸繋縛無復罣礙。如虚空中風自在旋轉。故名大力。"},{"id":"un-00-0020","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"此大堅固力本從諸佛金剛種性生。又於無量劫已來。常以此訶字眞因具修法行。佉字萬徳一一皆如金剛不可破壞。是名大力義復次恐怖義者。謂是吽字者一切如來誠實語。所謂一切諸法無因無果本來清淨圓寂義。是故纔發菩提心。即坐菩提道場轉正法輪。由此相應故能證悟一切佛法。念念具薩般若智。直至究竟坐金剛座。四魔現前則入大慈三摩地。恐怖降伏四魔等。所謂四魔者蘊魔煩惱魔死魔天魔。如是魔軍無不恐怖降伏。猶如日輪纔擧暗暝消退。復次如來以何法恐怖諸障耶。謂即以此吽字門也。下三昧畫即是具修萬行。上有大空點即是已成萬徳。訶字即是法幢旗。三昧空點合故即是高峯觀三昧。上點是明妃之母。"},{"id":"un-00-0021","work":"吽字義","source":"T77n2430 吽字義（提供テキスト由来・原典未照合）","juan":"一卷","text":"下畫是胎分日増。如是義故適發聲時魔軍散壞。即是恐怖義也復次等觀歡喜義者。此吽字中有訶字是歡喜義。上有大空是三昧耶。下有三昧畫字是亦三昧耶。二三昧耶中行。三世諸佛皆同此觀。故名等觀義"},{"id":"goyuigo-00-0001","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"御遺告遺告諸弟子等應勤護東寺眞言宗家後世内外事管合貳拾伍條状竊以大法同味興廢任機。師資累代付法在人。鷲峯視聽傳流中洲鐵塔傳教利見烏卯。探流尋源鑒晃討本。大唐曲成既有血脈。日本末葉何無後生。仍聊示之初示成立由縁起第一雖末資從非東寺一阿闍梨以降。勿令此遺告寫持守惜如眼肝夫以吾昔得生在父母家時。生年五六之間夢常見居坐八葉蓮華之中諸佛共語也。雖然專不語父母況語他人。此間父母偏悲字號貴物多布度毛能止年始十二。爰父母曰。我子是昔可佛弟子。以何知之。夢見從天笠國聖人僧來入我等懷。如是任胎産生子也。"},{"id":"goyuigo-00-0002","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"然則齎此子將作佛弟子吾若少之耳聞喜以埿土常作佛像造宅邊童堂安置彼内奉禮爲事。此時吾父佐伯氏。讃岐國多度郡人。昔征敵毛被班土矣。母阿刀氏人也。爰外𭔡舅阿刀大足大夫等曰。從爲佛弟子不如出大學令習文書立身。任此教言受俗典少書等及史傳兼學文章。然後及于生年十五入京。初逢石淵贈僧正大師受大虚空藏等并能滿虚空藏法呂入心念持。後經遊大學從直講味酒淨成讀毛詩左傳尚書。問左氏春秋於岡田博士。博覽經史專好佛經。恒思我之所習上古俗教眼前都無利弼乎。一期之後此風已止。不如仰眞福田。因作三教指歸三卷。成近士號稱無空。名山絶巘之處嵯峨孤岸之原。遠然獨向淹留苦行。或上阿波大瀧嶽修行。"},{"id":"goyuigo-00-0003","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"或於土左室生門崎寂暫。心觀明星入口。虚空藏光明照來顯菩薩之威現佛法之無二。厥苦節也則嚴冬深雪被藤衣而顯精進道。炎夏極熱斷絶穀漿朝暮懺悔及于二十年。爰大師石淵贈僧正召率發向和泉國槇尾山寺。於此剃除髺髮授沙彌十戒七十二威儀。名稱教海後改稱如空。此時佛前發誓願曰。吾從佛法常求尋要。三乘五乘十二部經心神有疑未以爲決。唯願三世十方諸佛示我不二。一心祈感夢有人告曰。於此有經名字大毘盧遮那經是乃所要也。即隨喜尋得件經王。在大日本國高市郡久米道場東塔下。於此一部解𫄅普覽衆情有滯無所憚問。更作發心以去延暦二十三年五月十二日入唐。爲初學習。天應慰懃載勅渡海。彼海路間三千里。"},{"id":"goyuigo-00-0004","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"先例至于楊蘇洲無質云云而此度般増七百里到衡洲多礙。此間大使越前國大守正三位藤原朝臣賀能。作自手書呈衡洲司。洲司披看即以此文已了。如此兩三度。雖然封船追人令居濕沙之上。此時大使述云。切愁之今也。抑大徳筆主呈書云云爰吾作書樣替於大使呈彼洲長。披覽含咲開船加問。即奏長安經三十九箇日。給於洲府力使四人且給資糧。洲長好問作借屋十三烟令住。經五十八箇日給存問勅使等。彼義式罔極。覽之主客各各流涙。次後給迎客使。給於大使以七珍鞍。次次使等皆給粧鞍。長安入京義式無可説盡。見之者滿於遐邇也。此間大使賀能大夫達向者歸國。惟延暦二十四年電時也。即配大唐貞元二十一年也。"},{"id":"goyuigo-00-0005","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"爰少僧并橘大夫准勅留學具在別記即少僧遇上都長安青龍寺大徳内供奉十禪師惠果大阿闍梨。沐五智灌頂學胎藏金剛兩部祕密法。及讀毘盧遮那金剛頂經等二百餘卷。并諸新譯經論唐梵合存。少僧以大同二年歸我本國。此間海中人人云。日本天皇崩云云聞諫是言尋本口言船内諸人論爭首尾都不一定。注檕著岸。或人言告。天皇某日時崩者。少僧懷悲給素服。從爾以降帝經四朝奉爲國家建壇修法五十一箇度。亦神泉薗池邊御願修法祈雨靈驗其明。上從殿上下至四元。此池有龍王名善如。元是無熱達池龍王類。有慈爲人不至害心。以何知之。御修法之此吒人示之。即敬眞言奧旨從池中現形之時悉地成就。"},{"id":"goyuigo-00-0006","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"彼現形業宛如金色長八寸許蛇。此金色蛇居在長九尺許蛇之頂也。見此現形弟子等實惠大徳并眞濟眞雅眞照堅慧眞曉眞然等也。諸弟子等敢難覽著。具注言心奏聞内裏。少時之間勅使和氣眞繩御弊種種色物供奉龍王。眞言道崇從爾彌起也。若此池龍王移他界淺池減水薄世乏人。方至此時須不令知公家私加祈願而已。亦授灌頂者蓋以員多。具不注之。若存灌頂流者自我身始。祕密眞言此時而立。夫師資相傳嫡嫡繼來者。大祖大毘盧遮那佛授金剛薩埵菩薩。金剛薩埵菩薩傳于龍猛菩薩。龍猛菩薩下至大唐玄宗肅宗代宗三朝灌頂國師特進試鴻臚卿大興善寺三藏沙門大廣智不空阿闍梨六葉焉。惠果則其上足法化也。凡勘付法。"},{"id":"goyuigo-00-0007","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"至于吾身相傳八代也。吾到日彼大阿闍梨曰。我命既盡待汝既尚。已果來我道東矣。故呉殷纂云。今有大日本國沙門來求聖教。皆令所學可如瀉瓶。此沙門是非凡徒三地菩薩也。内具大乘心外示少國沙門相云云大阿闍梨御相弟子内供奉十禪師順曉阿闍梨之弟子玉堂寺僧珍賀申云。日本座主設雖聖人是非門徒也。須令學諸教。而何擬被授蜜教云云兩三般妨申。於是珍賀夜夢降伏曉旦來至。少僧三拜過失謝言云云又去弘仁七年表請紀伊國南山殊爲入定處。作一兩草庵。去高雄舊居移入南山。厥峯絶遙遠阻人氣。吾居住時頻在明神衞護。常語門人。吾性狎山水疎人事。亦是浮雲之類。追年待終爲此窟東。"},{"id":"goyuigo-00-0008","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"太上皇有勅請下安宿中務供養餘月。還更居高雄天長皇帝即位任少僧都。再三奏辭不允在公。雖云萬事無遑。春秋之間必一往看。彼山裏路邊有女神。名曰丹生津姫命。其社迴有十町許澤。若人到著即時傷害。方吾上登日託巫税曰。妾在神道望威福久也。方今菩薩到此山妾之幸也。弟子昔現人之時食國𭽡命給家地以萬許町。南限南海。北限日本河。東限大日本國。西限應神山谷也。冀也獻永世表仰信情云云如今件地中所有見開田三許町名常庄是也。吾自去天長九年十一月十二日。深厭穀味專好坐禪。皆是令法久住勝計。并爲末世後生弟子門徒等之也。方今諸弟子等諦聽諦聽。吾生期今不幾。仁等好住愼守教法。吾永歸山。"},{"id":"goyuigo-00-0009","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"吾擬入滅者今年三月二十一日寅剋。諸弟子等莫爲悲泣。吾即滅而歸信兩部三寶。自然代吾被眷顧。吾生年六十二臘四十一。吾初思及于一百歳住世奉護教法。然而恃諸弟子等忩永擬即世也。但弘仁帝皇給以東寺。不勝歡喜。成祕密道場。努力努力勿令他人雜住。非此狹心護眞謀也。雖圓妙法非五千分。雖廣東寺非異類地。以何言之。去弘仁十四年五月十九日以東寺永給預於少僧勅使藤原良房公卿也勅書在別。即爲眞言密教庭既畢。師師相傳爲道場者也。豈可非門徒者猥雜哉一以實惠大徳吾滅度之後可爲諸弟子依師長者縁起第二夫以吾道興然專此･大徳言力也。因玆所示告也。以眞言爲本宗以顯教爲邊教。他有眼青自存融通。"},{"id":"goyuigo-00-0010","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"人師國寶本豈益此國徳哉。仍大經藏事一向預此大徳。但若實惠大徳不幸後者以眞雅法師處分封納開合。依之未知情弟子等勿令封開。愚情師師長短深深必語他家歟。可愼可愼。亦菩提實數珠是大唐帝皇給勅矣。即恩勅曰。仁以此爲朕代莫永忘。朕初謂公留將師。而今延還東惟道理也。欲待後紀朕年既越半也。願一期之後必逢佛會者。加以賞賜算算。以先日誤注大師惠果之所給也。但金剛子是大師阿闍梨耶所給。亦諸道具大師阿闍梨耶付屬也。豈可輕哉一以弘福寺可屬眞雅法師縁起第三右寺是飛鳥淨三原宮御宇天武天皇御願也。而天長聖主垂勅永常加東寺可修治之由畢也。伏惟聖恩是依少僧通詣高野所給宿處而已。"},{"id":"goyuigo-00-0011","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"依之少僧永可師師相傳修治者也。但眞雅法師一期之後者諸弟子等之中在前出身者可掌東寺。不可求年﨟次第。亦門徒之間以一成立可爲長者。爲長者者可加掌弘福寺。稱佛陀宮。非爲己宿所嚴佛修治爲宗計也一以珍皇寺字宕當寺可修治後生弟子門徒之中縁起第四右寺建立大師是吾祖師故慶俊僧都也。依有諸門徒相共付屬加修治來者也。然則以能修治之人任寺司可令住持。莫用不能者一可號東寺教王護國之寺縁起第五夫以大唐惠果大師奉勅青龍寺師師相傳。元名大官道場。然而大興善寺大阿闍梨耶被勅爲祕蜜之場。改號青龍寺。方今准彼以東寺可號教王護國寺。額是既奉勅而已。宜可奏此由。亦吾漢號遍照金剛。"},{"id":"goyuigo-00-0012","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"宜知行一東寺灌頂院宗徒長者大阿闍梨可加撿挍縁起第六右院雖未造畢且始傳燈之志。雖此間所思千迴草草入山非遂此志。然則實惠大徳一向可造功畢。亦諸莊嚴可如語先先。但恒例灌頂阿闍梨者門徒之内最初以成立者可令修御願。若有殊病妨者以次人可請用之。若是辭退者永非吾後生弟子門徒。宜應信奉一食堂佛前召侍大阿闍梨并二十四僧童子等可令習誦五悔縁起第七右案大唐青龍寺例。宗徒大阿闍梨之童子并諸名徳達之童子等令會集食堂。僧達一人童達一人。共令習學五悔毎夜現槧。即闕大衆所得十分之一。充行諸童子等紙墨料。案彼示此而已。但遂不可成出者雖常住寺内更强喚不可令此庭列。見器惟品可催之。"},{"id":"goyuigo-00-0013","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"亦九方便於大阿闍梨前召集諸徳弟子之内堪能之僧等。毎夕可令習誦。昔大師阿闍梨耶曰。准飡受諸護法天神法味乍守護場等者。准彼示此。遑他事勿駐自一吾後生弟子門徒等以大安寺可爲本寺縁起第八夫以大安寺是兜率之搆。祇園精舍業矣。尊像釋迦即智法身之相也。初發心本吾祖師道慈律師遂爲推古天皇御願者也。依之吾大師石淵贈僧正彼寺爲本寺。而御弟子等皆令入住也。隨吾以彼寺爲本寺也。但依勅命渡東大寺建立南院。此間出生弟子等便宜入住東大寺也。方今案本意。吾先師御寺大安寺是勝地矣。先師嘗地被建立也。須吾弟子後生門徒等以彼寺爲本寺仕奉釋迦大師彼中以西塔院爲根本岫。具由在別多羅而已。"},{"id":"goyuigo-00-0014","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"復師資血脈圖在別紙。得一知萬一宿住眞言場欲爲師師門徒者必先須以情操爲本縁起第九夫以大唐眞言宗門徒本自不間他徒。從赤子時得人之子教爲弟子。如螟蛉以他子爲己子。後令出家。如是繼佛性門者也。然則准彼看定赤子勞養決心惟彼操行。若不可當早却他家。叶道理者留護習道。若使爲門徒内之者操行宜者非簡我師人資汲引繼蜜教性。設令雖親弟子操意不調者簡略不可同共。何況可令授眞奧之道哉一東寺可立長者縁起第十夫以爲吾弟子者末世後生弟子之内成立僧綱者。非求上下臈次。以最初成出可爲東寺長者。長者既是座主矣。准唐法欲奏聞座主號。雖思先先入山之間既令忘脱未遂此事。須諸弟子等必遂此事。"},{"id":"goyuigo-00-0015","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"皆是非有不要言。併令法久住謀而已。我後之資勿難斯乎一諸弟子等并爲後生末世弟子者可敬東寺長者縁起第十一夫以大唐法如青龍寺例。所以然者彼寺元來無有他類。雖僧數千皆非他徒。厥中若有一人不和之者。諸衆共和調情操令無嗷事。何況分疵及俗家哉。方今冀也一家之徒假使數千萬。各互護惜勿出他家。一心專念可將敬尊座主官長。誹彼謗此相互莫怨。亦我師人師勿爲限別。亦分慈眷勿簡我資人資。但不隨處風不叶宗意放逸邪見更不得共。都吾非末資。得一知千耳一末代弟子等可令兼學三論法相縁起第十二夫以眞言之道蜜教之理。同入性故入阿字義也。然而案萬物意皆在内外。然則以蜜爲内以顯爲外必可兼學。"},{"id":"goyuigo-00-0016","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"因玆輕本宗勿重末學宜知吾心兼學而已。但人任器不堪兼者將任本業精進修行。具由在別青龍寺例專此而已。依彼示之。亦宗分講讀定額中非要望以智行人簡定一東寺定供僧二十四口縁起第十三夫以件寺定供僧元注官符五十口。今奏定二十四口。方今伺末代所有志本願聖靈元庭速崩未堪造畢。加以未入庄田正税等。寺大料少因以奏定。就中二十一口修學練行者。三口即三綱造治雜預者也。是亦皆用淨行之人。勿用員外人有犯之僧。但有工巧意操風流可用修理造作莊嚴佛事者。不求淨不淨置於非入寺之權三綱。依之不得猥雜他家穢僧等。"},{"id":"goyuigo-00-0017","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"阿闍梨耶得一悟千一可請用以二十四口定額僧宮中正月後七日御願修法修僧縁起第十四夫以大唐青龍寺住僧數千。就中定供僧一百口皆祕密徒也。即内道場御願正月修僧等以此請用。但今案物意我日本國修僧十五口之中。大阿闍梨耶一人。入室弟子一人謂入室弟子者是爲令守佛舍利等也三綱之中行事一人。今以十二口可請用於年替。彼支度皆在式文。勿令請用努力他僧。須先録七日以前修僧等名簿奏聞。次參入修僧畢之後亦奏聞。若在殿上仰被省捨僧徒者。雖厥之人速可令罷出。依此不得請補非門徒僧。但任大阿闍梨心。簡定門徒之中智行者。"},{"id":"goyuigo-00-0018","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"亦經奏聞請用而已云云一宮中御願正月修法修僧等分各所得上分可充高野寺修理雜用縁起第十五夫以大唐青龍寺祖師被建立天台山下私少伽藍矣。彼名新禪寺也。以内道場正月施物上分令修理彼道場。亦以青龍寺大衆年中所得上分令充用彼用也。此非凡政芳師資迹謀也。莫咲難後生資云云一可試度宗家年分縁起第十六夫以件宗分度者須如初思試度東寺。然而欲不令荒山家更改奏官符欲申下金剛峯寺者也。敢厭東寺汲南嶽哉。今須東寺座主大阿闍梨耶執事欲改直之。亦簡定諸定額僧中能才童子等。於山家試度。即於東大寺戒壇受具足戒。受戒之後於山家三箇年練行。厥後各各隨師受學蜜教。具在先文而已。"},{"id":"goyuigo-00-0019","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"但曰座主大阿闍梨者即東寺大別當號也。門徒之間修學最初成出爲長者言也。不可求臈次。修學爲先最初成立爲長者而已一可報進後生末世弟子祖師恩縁起第十七夫以東寺座主大阿闍梨耶者吾末世後生弟子也。吾滅度以後弟子數千萬之間長者也。雖門徒數千萬。併吾後生弟子也。雖不見祖師吾顏有心之者。必聞吾名號知恩徳之由。是吾非欲白屍之上更人之勞。護繼蜜教壽命可令開龍三華庭謀也。吾閉眼之後必方往生兜率他天可侍彌勒慈尊御前。五十六億餘之後必慈尊御共下生祇候可問吾先跡。亦且未下之間見微雲官可察信否。是時有勤得祐不信之者不幸。努力努力勿爲後疎。亦案僧尼令曰。非有碁琴制限者。"},{"id":"goyuigo-00-0020","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"然而竊案蜜教心此家可令無此事。所以然者若有未練僧并童子等被放此遊必有後代過。何況圍碁雙六一切亭止。若强好此事者都吾非末世資。不論刹利種性蔭子蔭孫併悉追放。一切勿得寛宥云云一不可入東寺僧房女人縁起第十八夫以女人是萬性本弘氏繼門者也。然而於佛弟子親厚諸惡根源嗷嗷本也。是以六波羅蜜經曰。不可女人親近。若猶親近善法皆盡等云云然則不可入居僧房内。若有要言諸家使至者。立外戸速返報却之。不得迴時剋。具准青龍寺例云云一不可飮僧房内酒縁起第十九夫以酒是治病珍風除之寶矣。然而於佛家爲大過者也。是以長阿含經曰。飮酒有六種過等云云智度論曰。有四十五種過等云云亦梵網經所説甚深也。"},{"id":"goyuigo-00-0021","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"何況祕密門徒可酒愛用哉。依之所制也。但青龍寺大師與并御相弟子内供奉十禪師順曉阿闍梨共語擬曰。依大乘開文之法治病之人許鹽酒。依之亦圓坐之次呼平不得數用。若有必用從外入不瓶之器來副茶祕用云云一可令神護寺家宗門徒長者大阿闍梨口入縁起第二十夫以神護寺是和氣氏建立。八幡大菩薩主吒庭也。而依眞繩大夫達所言。余頃年修住。爰眞繩大夫達於建立蜜教之言朝夕宛如示護法之相。因玆師檀之期篤在肝岫加以寺院付屬永代敢無内外之汚。然而後代必有爭嗷。吾資末羽等隨状進退而已。得一知萬云云一輒不可授傳法灌頂阿闍梨職位并兩部大法縁起第二十一夫以蜜教是大日如來心肝金剛薩埵腦膽者也。"},{"id":"goyuigo-00-0022","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"而輒授非器之者從蜜教主御身有出血之罪。是以昔大日尊勅金剛薩埵曰。不可授非器之者。若授非器之者蜜教不久。從法身出血罪自然可生者。又金剛薩埵宣龍猛菩薩。伏以大日如來爲一切衆生説蜜教也。無非蒙萬生利益。但此法者是如如意寶珠。喩如意寶珠在名號聞不顯實身。然而出生萬寶利益一切衆生。存龍宮祕藏居龍王肝輒不顯身。雖居祕藏并龍肝。此玉不被攝龍王衆。是法亦亦如此。所以者何。雖存蜜法阿闍梨之心肝并經藏。不被任阿闍梨之心府。雖有名號聞不顯實身。唯以威光利益一切衆生。蜜教最貴最尊道理唯是然也。是故阿闍梨耶我能欲知道任己私劣心不可授非器之者。"},{"id":"goyuigo-00-0023","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"若有頗證器之者唯授尊法看定彼心器然後授金剛界大法一部。然授猶未練根之者必後可有悔。何況輒授兩部大法哉。但欲授兩部大法。顯見定人器氣色之後。向本尊界會能祈願夢見厥想。若有感應彼欲學者三箇月令修行精進然後可授兩部大法。但於傳法灌頂阿闍梨職位專然不應授諾。所以者何。授非器之者金剛薩埵與蜜迹神倶加呵嘖。授證器之者作大歡喜。是則令法久住縁也。護惜傳法灌頂位阿闍梨職應護惜己肝神。輒不應令知傳法印契蜜語。若有精進者望仰。唯大阿闍梨以語言呼許諾言。以五智五股加持仰人之首三般散瓶水。是亦看定證器之人應令如然。啻以是人於修法處應充用諸護摩雜道。亦以尊法可許授弟子於一部。"},{"id":"goyuigo-00-0024","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"兩部更不可令傳教以傳教言可惜傳法於傳法印契蜜語爲能學者可傳授練根已熟弟子。猶未熟根更不可授。須大阿闍梨耶求得世間人之赤子以方便言令出離世俗。語量彼操意令出家入道得度受具足戒。滿生年五十以後授傳法灌頂阿闍梨耶職位可令繼蜜教種性。哀哉嘆哉此道欲不傳者應斷法種。傳授之時宛如令持若赤子兩舌劍。宜知是心應授阿闍梨職位。不忍非器之人甘語言諾授是位。彼此會坐相更披露蜜教肝印。正教非嚴滅法之相自然將至。是罪所可得傳法阿闍梨也。十佛大日御前百千劫懺悔都不滅除。是以入室有勞弟子於非器之者更不可授是位者云云是章句在梵本。從經文并儀軌之外取離出所蜜納也。吾三衣箱底納置。"},{"id":"goyuigo-00-0025","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"亦在精進峯入室弟子沙門土心水師所云云一金剛峯寺加東寺宗家大阿闍梨應眷務縁起第二十二右件寺者是少僧私所建立也。然而進官爲御願庭者也。宜知是心。吾弟子等中先成立長者東寺座主大阿闍梨耶一向應管攝。莫遺告誤得一知萬云云一宀一山土心水師建立道場毎朔可修避蛇法三箇日夜縁起第二十三此條不可令案内文書散眼守猶護己如肝云云夫以避蛇法呂者是凡非所傳。金人祕要阿闍梨心肝口決也具在別意東寺代代大阿闍梨像想彼修法。乍毎後夜念誦畢爲護身而已。籠道肝於精進峯。亦本尊海會安彼岫也。是祕密呂不語者不知。念煩千迴也。不可令專猥聞。"},{"id":"goyuigo-00-0026","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"得一知萬云云一東寺座主大阿闍梨耶可護持如意寶珠縁起第二十四此條章專不可令案文書散護守此法宛如傳法印契蜜語夫以如意寶珠是從無始以來非有龍肝鳳腦等。自然道理如來分身者也。或偏鳳肝龍腦云云是大虚言也。所以者何。自然道理如來分身。惟眞實如意寶珠也。號自然道理如來分身者是任祖師大阿闍梨口決成生玉也。蜜之上蜜深之上深者。輒不注儀軌。是大日如來所説也。曰成生玉是能作性玉也。須以九種物爲之。爾九種者。一佛舍利三十二粒。二未用他色沙金五十兩。三紫檀十兩。四白檀十兩。五百心樹沈十兩。六桑木沈十兩。七桃木沈十兩。八大唐香木沈十兩謂香木沈以專名香木沈。"},{"id":"goyuigo-00-0027","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"不簡彼色唯以清淨用之九漢桃木沈十兩也。是等之中沙金五十兩白銀五十兩未用他色以是合爲壼。安置彼三十二粒舍利。即便永閉壼口誦封堅結。以彼六種香木沈入未用他色鐵臼春之。以未用他色絹嚢漏之七箇度。其糟亦同春末入同嚢漏之。如是乍無妨物未用他色以眞漆丸之。等分合成奉入彼佛舍利壼。方圓合丸高下等分。如此之間大阿闍梨立屛風率清淨細工入居屛風之内可令合丸。彼細工之口含名香。專不雜語爲丸之。亦大阿闍梨耶者同口含名香。誦不動眞言三百遍。次誦佛眼眞言一千遍令爲丸。亦未用他色以香油炬五方明燈。但眞言雖滿呪遍及于事畢猶員外可誦之。亦同門之間以智行僧十五口立替。乍以一番二時爲剋限。"},{"id":"goyuigo-00-0028","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"結三箇番不斷修法。此十五口僧者却屛風三丈許也。雖同門僧不令知事心。造玉既畢而始從事發七箇日夜之間不斷修法。此七箇日夜法前後可神供。然後以寶珠入檜深箱安置寶臺。其寶臺者作水壇。其中敷細絹可立臺。壇迴引五色糸。然後不求吉日更亦率五口智行僧親從大阿闍梨三時念誦。亦以五口僧内毎時介子供。如是可滿百箇日夜。十日之間神供。又彼寶珠至于滿百箇日夜輒不可見大阿闍梨耶。何況他人可令見哉。滿百日。之後者以赤色九條衣可裏此玉。亦大阿闍梨誦再拜言。口曰再拜而實拜三般。即手取玉頂戴可月輪觀行。然後玉乍裏赤色袈裟大阿闍梨隨身毎常歸命頂禮。出入前後左右可恃仰之。"},{"id":"goyuigo-00-0029","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"亦入室智行弟子不可令見知。假令雖見有箱不令見知寶珠所在。案道理意在大海底龍宮寶藏無數玉。然而如意寶珠爲皇帝。方伺其實體自然道理釋迦分身也。以何知之。此玉從寶藏。通海龍王肝頸下。藏與頸不斷常住。或時出善風發雲於四洲令生長萬物利益一切衆生。水府陸地萬物誰不蒙利益哉。而世間凡夫等任己愚口稱如意玉涌寶。彼海底玉常此通能作性寶珠御許親近分徳。所以可觀大阿闍梨曰歸命頂禮在大海龍王藏并肝頸如意寶珠權現大士等。三般誦之念觀可念誦本尊眞言。凡却一切惡可爲攀善性之心。是法呂大毘盧遮那經文也。雖然蜜之上蜜深之上深者。𨷂留祕句唯爲阿闍梨心槧也。專不可令寫散。若是披露者蜜教不久。"},{"id":"goyuigo-00-0030","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"親弟子等之内彼心性不調者更不可令授知。代代座主阿闍梨耶。若自門弟子。若同門之内相弟子。并諸門徒衆等之中。能者看定。以怨親平等觀行。可令預護。若簡付法弟子等中者渉枝枝不留大阿闍梨耶手。移門門以被披露不信者。遂可爲淡道自然隠沒。因玆密教將滅。然則猶爲東寺座主長者之人必應付屬。彼擬付屬之日三箇日洗浴觀念兩部諸尊。亦觀驚普天之下率土之上冥官衆發起四無量觀付屬而已。雖慈父母勿令知之。如此祕密即是護三蜜教肝性也。但大唐大師阿闍梨耶所被付屬能作性如意寶珠載頂。渡大日本國勞籠名山勝地既畢。彼勝地者所謂精進峯士心水師修行之岫東嶺而已。努力努力勿令知後人彼處。"},{"id":"goyuigo-00-0031","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"是以蜜教劫榮末徒博延復東寺大經藏佛舍利大阿闍梨須如守惜傳法印契蜜語。勿令一粒他散。是即如意寶殊。是即護道。以何言之。彼能作玉心本之故一若有末世凶婆非禰等擬破蜜華薗應修法縁起第二十五夫以昔南天竺國有一凶婆一非禰等破是蜜薗華。爾時華薗門徒之中有一强信者。修奧砂子平法呂七箇日夜。彌亦次次修員度者。彼凶婆等自退爲蜜華薗安寂也。是以末世阿闍梨耶宜知是由必應勤守彼法呂。彼法呂者在入室弟子宀一山精進嶺土心水師之竹木目底。然則大阿闍梨耶是道惜護宛如傳法灌頂阿闍梨職位印契。凡須傳法印契蜜語並調凶婆法呂輒不可授非器心不調者。若如是道任己私心無簡授放之時。"},{"id":"goyuigo-00-0032","work":"御遺告","source":"提供テキスト『御遺告』（出典・版本未確認）","juan":"一卷","text":"諸尊護法天等倶共非聽。於大阿闍梨爲大災矣。選覔善人授放之時倶共爲大歡喜令續法性種。所以阿闍梨存心肝槧待覔器人可非斷蜜教之子。當知易得難大阿闍梨位。豈應非用心哉。是以非可令傳法印蜜語猥雜右件遺書努力不得違失故告承知二年三月十五日入唐求法妙門空海"},{"id":"ajikan-00-0001","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"阿字觀用心口決檜尾記先欲觀此字者。天井四方強不迫處。不暗不明坐。暗妄念起。明心散亂。夜ハ燈ヲ風ニ挑。火向後座蒲團敷。結跏趺坐或半跏坐。法界定印結。眼不開不閉。開散動閉眠沈。唯細見不瞬。而兩方瞳可守鼻柱。舌付腭息自靜也。腰不反不伏。直坐助脈道。血脈道差病起。又心狂亂。如此用心。先金剛合掌。五大願唱。後胎五字明百遍誦。其後觀。先能詮字觀。次所詮理思。能詮字者。自身胸中有月輪。如秋夜月晴。其中有a字。a字月輪種子。月輪a字光。月輪與阿字全一也。胸中觀之。自身成阿字。阿字即自心也。如是心境不二。而縁慮亡絶。月輪自性清淨故。能離貪慾垢。月輪清涼故。去瞋恚熱。"},{"id":"ajikan-00-0002","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"月輪光明故。照愚癡闇。如此三毒自然清淨離散。湛然自苦事無之。入此觀者。得安樂離世間苦惱。是名解脱。何況觀達。於生死可自在。是爲即身成佛。始一肘量月輪分齊觀。後漸漸舒遍三千世界乃至法界宮。次所詮理者。此阿字有空有不生三義。空者森羅萬法皆無自性。是全空也。然依因縁假諦現。萬法歴然有之。譬如意珠湛七珍萬寶。而如隨縁降寶。破玉見中一物無之。雖然隨縁生寶非無是以知。空有全一體也。是云常住。常住則不生不滅也。是名阿字大空當體極理。然我等胸中此字觀。自然具足此三義。具此三義者。即大日法身也。入此觀門行者。雖初心生死輪迴永絶。行住坐臥無離皆是阿字觀也。易行易修。"},{"id":"ajikan-00-0003","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"而速疾頓悟也。若既坐逹。必非半跏法界定印。行住坐臥。悉阿字事思。我等聲生起事。開口最初。胸中從阿生而當喉腭舌齒脣。出此五處。金界五部諸佛説法聲。喉舌脣云時。胎藏三部也。如此知。徒事無之。惡口兩舌妄語綺語。皆經五處三内出音。即大日如來海印三昧王眞言也。此理不知。皆成惡業墮惡趣受諸苦。知與不知差別也。蓮華三昧經云。胸中兩部曼荼羅坐烈。各下轉神變。其中西方無量壽如來。守説法談義徳。常恒説法。其音自我口出。成聲塵解脱利益也。然凡夫不知之我語思。被封我物執情。恒沙萬徳無量密號。名字功徳法門氣聲。只徒成惡趣業因事誠可悲。是則自然道理陀羅尼性海果分法門本不生極理也。"},{"id":"ajikan-00-0004","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"如海攝百川。一切善根收此一字故。云海印三昧眞言也。依之一度觀此字。八萬佛教同時勝讀誦功徳廣略祕觀御口云。眞言觀門雖多途。取要不過廣略二觀。先略觀者。大日經第一云。祕密主云何菩提。謂如實知自心。此文對大日。金剛薩埵問。大日知自心答給也。疏七云。若見本不生際者。即是如實知自心。如實知自心。即是一切智智。故經所説如實知自心者。見本不生際也。見本不生際。爲一切智智。一切智智者。即大日也。故眞言教即身成佛者。見本不生也。本不生際者。一切諸法從本以來。不生不滅本有常住也。煩惱本不生煩惱。菩提本不生菩提也。如此知名一切智智。然我等生滅去來。當眼易知。不生不滅所不知也。"},{"id":"ajikan-00-0005","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"如此諸法本來不生不滅義。顯教盛談之故。此不生不滅名言。不密教不共談。然今密教規模者。所不及凡夫見聞覺知。不生不滅體。直顯種子三摩耶形令見知之令修之。是顯教都所不知也。所言本不生體者。種子阿字三摩耶形八葉蓮華。此八葉蓮華者。大日經所説h@rta心也。h@rta心者。即是衆生八分肉團也。同疏五云。内心妙白蓮者。此是衆生本心妙法芬陀利華祕密幖幟。華臺八葉圓滿均等。如正開敷之形。此蓮華臺。是實相自然智慧。蓮華葉者。是大悲方便也。正以此藏爲大悲胎藏曼荼羅之體。其餘三重。是從此自證功徳流出諸善知識入法界門耳。此曼荼羅極少之量。齊十六指。大則無限也。"},{"id":"ajikan-00-0006","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"今此文内心妙白蓮者。此是衆生本心妙法芬陀利華之h@rta心也。此心蓮可觀也。其觀想樣。心中可觀有八葉蓮華。蓮華形世間如蓮華形。唯此蓮華計可觀也。八葉蓮華者。h@rta心是也。sita心住此蓮華。此二心暫時不離故。蓮華上可觀月輪。月輪者sita心也。h@rta心形。實如月輪形也。月輪形圓形事。如水精珠等。又蓮華種子阿字也。故月輪中可觀阿字。阿字形如常書形。迴四方可有也。常書是一方計也。上下無其形。一切梵字形四方事。以阿字可准知之。今此阿字蓮華月輪之中。若蓮華計觀。若蓮華月輪觀。若蓮華阿字可觀。可住行者意也。月輪勢一肘也。不可減此量。又付此略觀有二樣。"},{"id":"ajikan-00-0007","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"一先一肘觀八葉蓮華。如此彼此相對。歴然觀之。其後前一肘所觀蓮華。可召入自身中。是如常入我我入觀也。一先前一肘觀蓮華。觀念無退轉。經年月勤修之所觀蓮華等。閉目見程。觀後自身可召入之。問。此阿字蓮華者。本不生際實體顯事也。作此觀時。此種子三形義理觀之乎。口云。觀法時別不思惟義理。唯其形色。如法歴然觀之計也。又云。此阿字世間多書置之故。人輕之常事樣思。是大僻按也。此阿字即淨菩提心實體。即身成佛肝心者也。以上略觀畢次廣觀者。義釋云。若行者見一切從縁起法。皆是毘盧遮那法界身。爾時十方通同爲一佛國。是名究竟淨菩提心文今此釋意。對一切縁起諸法。皆照毘盧遮那法身。"},{"id":"ajikan-00-0008","work":"阿字觀用心口決","source":"提供テキスト『阿字觀用心口決』（出典・版本未確認）","juan":"一卷","text":"其故一切諸法不出色心二法。色心二法。即是六大也。六大即是毘盧遮那法界身也。爾時十方通同爲一佛國者。既押一切縁起諸法。直照毘盧遮那法身故。十方淨土六道穢所無有差別。同一法界宮也。心寂靜時住略觀。散亂時可住廣觀此二觀門是極祕也。行住坐臥無懈。精進修行。速可開顯淨菩提心者也。已上祕觀也"},{"id":"kokusho-00-0001","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"序","text":"余少小也頗貴先氏之風志學之後樂寂歴有一上人號曰大遍照金剛青襟摘梶林之春秋綺帳富山河之英萃遂則陋域中近智神木靈草之區耳目所經未嘗不究每嘆曰去延曆末歳命入唐遣見京城青龍寺大德慧果阿闍梨即南天竺大辯正三藏上足弟子厚曰吾待汝久來何遲矣生期向闕勤早代宗皇帝所師供也和尚始一目以喜待已受則授二部大曼荼羅法百餘部祕藏上人性也得善聆聲知意經目止口積年之功旬時學得大師亦奄然而從化故付法云今有日本沙門來求聖教以兩部祕奧壇儀印契唐梵無差感受於心猶加瀉甁吉矣汝傳燈第八祈負者吾師是也故得傳命以唐梵之式答恩以秘密之寶真言加持之道此日來漸受荼灌頂之風是時彌布是則以我上國聖出聖運大化兼徹"},{"id":"kokusho-00-0002","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"序","text":"而令印度新教授若人弟子久渇滴塵恭到下風鐘嶺相響新扣如舊執事年深未見其淺誠知二氣變龍雲雷成音信不虚言也和尚昔在唐日作離合詩贈士僧惟上前御史大夫泉州別駕馬憩一時大才也覧則驚怪因送詩云何乃萬里來使絶域寫憂殊方通心詞翰倶美誠興東方君子之風故毗陵子胡伯崇歌云說四句演毘尼凡夫聽者盡歸依天假吾師多伎術就中草聖寂狂逸不可得難再見是以啄雞弁獸之黙獣留九州涌雲廻水畫盛變八紘或臥煙霞而獨嘯任意賦詠或對天問以獻納隨手成章至如慕仙詩可觀夫其詩賦哀讀之作碑誦表書之制所遇而作不假草案纔了不競把無由再看之集記器得五百以來紙兼嫉唐人贈咨稍舉警策雜此帙中編成十卷名曰遍照發揮性靈集其餘調分卷"},{"id":"kokusho-00-0003","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"序","text":"別者今之所不撰也願吾黨好事末味師迹伸禪餘之憩來時時披對"},{"id":"kokusho-01-0001","work":"遍照發揮性靈集","source":"国書データベース 300106923 遍照發揮性靈集（目視読み取り・散文の抜粋のみ・未照合）","juan":"第二","text":"沙門勝道歷山水瑩玄珠碑 并序沙門遍照金剛文并書蘇巔驚嶽異人所都物化產豈徒然乎請試論之夫境隨心變心垢則境濁心逐境移境開則心朗心境寬會山託智水臺鏡瑩磨俯應機水者也有沙門勝道者下野芳賀人也俗姓若田氏神邈枚蟻之齡意清情囊之齒極柳四民之生事調飢三諦之滅業厭聚落之轟轟仰林泉之皓然粵有同州補陀洛山慈嶺銀漢白峯衝吼翔鳳足而羊角魑魅罕通人蹊也絶借問振舌木有攀蹻者法師願義成而興歎仰勇猛以策意遂以去神護景不能上也還住半腹二十七日而却還又天應廿日夜堅發願曰若使神明有知願察我心所圖寫經及像等當至山頂爲神供養
